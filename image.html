<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeni-Image-generation</title>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#141414; --surface:#1e1e1e; --surface2:#272727; --surface3:#323232;
      --border:rgba(255,255,255,0.08); --accent:#EF7722;
      --accent-dim:rgba(239,119,34,0.12); --accent-glow:rgba(239,119,34,0.25);
      --text:#f0f0f0; --text-muted:#888; --text-dim:#505050;
      --header-h:54px; --sidebar-w:285px; --danger:#e05555;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    #app{display:flex;flex-direction:column;height:100dvh;width:100%;overflow:hidden;position:fixed;inset:0}

    /* ── HEADER ── */
    header{height:var(--header-h);min-height:var(--header-h);width:100%;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:100;flex-shrink:0}
    .header-side{display:flex;align-items:center;gap:4px;min-width:80px}
    .header-right{justify-content:flex-end}
    .logo{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;background:linear-gradient(135deg,#f4a96a,#EF7722);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;user-select:none}
    .icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s,color .15s,opacity .2s;flex-shrink:0;text-decoration:none}
    .icon-btn:active{background:var(--surface3)}
    .icon-btn.active{background:var(--accent-dim);color:var(--accent)}
    #headerNewChatBtn,#headerMenuBtn{opacity:0;pointer-events:none}
    #headerNewChatBtn.visible,#headerMenuBtn.visible{opacity:1;pointer-events:all}

    /* ── OVERLAY ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.show{opacity:1;pointer-events:all}

    /* ── SIDEBAR ── */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);max-width:90vw;background:var(--surface);border-right:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .27s cubic-bezier(.4,0,.2,1);will-change:transform}
    .sidebar.open{transform:translateX(0)}
    .sidebar-top{height:var(--header-h);min-height:var(--header-h);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
    .sidebar-top-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
    .sidebar-actions{padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
    .sidebar-action-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:background .15s,color .15s;text-align:left;width:100%;text-decoration:none}
    .sidebar-action-btn:active{background:var(--surface3)}
    .sidebar-action-btn i{font-size:16px;flex-shrink:0}
    .sidebar-action-btn.primary{color:var(--accent);font-weight:500}
    .sidebar-action-btn.primary:active{background:var(--accent-dim)}
    .sidebar-divider{height:1px;background:var(--border);margin:6px 14px;flex-shrink:0}
    .search-wrap{padding:8px 10px 4px;flex-shrink:0}
    .search-inner{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
    .search-inner i{font-size:14px;color:var(--text-dim);flex-shrink:0}
    #chatSearch{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px}
    #chatSearch::placeholder{color:var(--text-dim)}
    .chats-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;list-style:none;-webkit-overflow-scrolling:touch}
    .chats-list::-webkit-scrollbar{display:none}
    .chat-item{display:flex;align-items:center;padding:10px 10px 10px 12px;border-radius:10px;cursor:pointer;gap:4px;transition:background .12s}
    .chat-item:active{background:var(--surface2)}
    .chat-item.active{background:var(--accent-dim)}
    .chat-info{flex:1;min-width:0}
    .chat-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
    .chat-item.active .chat-name{color:var(--accent)}
    .chat-date{font-size:11px;color:var(--text-dim);margin-top:2px}
    .chat-menu-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .12s,color .12s}
    .chat-menu-btn:active{background:var(--surface3);color:var(--text)}

    /* ── IMAGE GALLERY PANEL ── */
    .gallery-panel{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);max-width:90vw;background:var(--surface);border-right:1px solid var(--border);z-index:350;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .27s cubic-bezier(.4,0,.2,1)}
    .gallery-panel.open{transform:translateX(0)}
    .gallery-top{height:var(--header-h);min-height:var(--header-h);padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
    .gallery-top span{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
    .gallery-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .gallery-grid::-webkit-scrollbar{display:none}
    .gallery-thumb{border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;background:var(--surface2);border:1px solid var(--border);position:relative;transition:opacity .15s}
    .gallery-thumb:active{opacity:.8}
    .gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .gallery-thumb-info{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:10px;color:rgba(255,255,255,.8)}
    .gallery-empty{grid-column:1/-1;padding:32px 16px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7}

    /* ── CONTEXT MENU ── */
    .ctx-menu{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:165px;max-width:165px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.93);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top left}
    .ctx-menu.show{opacity:1;transform:scale(1);pointer-events:all}
    .ctx-label{padding:8px 12px 6px;font-size:11.5px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ctx-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text);border:none;background:transparent;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:background .12s;text-decoration:none}
    .ctx-item:active{background:var(--surface3)}
    .ctx-item.danger{color:var(--danger)}
    .ctx-item.danger:active{background:rgba(224,85,85,.12)}
    .ctx-item i{font-size:15px;width:18px;flex-shrink:0}
    .header-ctx-menu{position:fixed;top:calc(var(--header-h) + 5px);right:10px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:195px;max-width:195px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.93) translateY(-4px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top right}
    .header-ctx-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
    .ctx-divider{height:1px;background:var(--border);margin:4px 8px}

    /* ── MAIN ── */
    main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .canvas-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 14px 10px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
    .canvas-area::-webkit-scrollbar{display:none}

    /* ── WELCOME ── */
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:30px;text-align:center}
    .welcome.hidden{display:none}
    .welcome-icon-box{width:65px;height:65px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:6px;box-shadow:0 8px 28px var(--accent-glow)}
    .welcome h2{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:var(--text)}
    .welcome p{font-size:14px;color:var(--text-muted);max-width:270px;line-height:1.65}
    .suggestion-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;max-width:330px}
    .chip{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);font-size:12.5px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:'DM Sans',sans-serif}
    .chip:active{background:var(--accent-dim);color:var(--accent);border-color:rgba(239,119,34,.3)}

    /* ── MESSAGES ── */
    .messages{display:flex;flex-direction:column;gap:18px}
    .msg{display:flex;flex-direction:column;max-width:90%;animation:msgIn .2s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;align-items:flex-end}
    .msg.ai{align-self:flex-start;align-items:flex-start}

    /* User bubble */
    .msg-bubble{padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:break-word;cursor:pointer}
    .msg.user .msg-bubble{background:rgba(239,119,34,.15);color:var(--text);border:1px solid rgba(239,119,34,.2);border-bottom-right-radius:4px}
    .msg-bubble img.ref-img{max-width:160px;border-radius:10px;margin-bottom:6px;display:block}

    /* User meta */
    .user-msg-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;overflow:hidden;max-height:0;opacity:0;margin-top:0;transform:translateY(-6px);transition:max-height .28s cubic-bezier(.4,0,.2,1),opacity .22s ease,margin-top .22s ease,transform .25s cubic-bezier(.4,0,.2,1)}
    .msg.user.show-meta .user-msg-meta{max-height:36px;opacity:1;margin-top:6px;transform:translateY(0)}
    .user-msg-time{font-size:11px;color:var(--text-dim)}
    .copy-btn-small{display:flex;align-items:center;font-size:14px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .12s,color .12s}
    .copy-btn-small:active{background:var(--surface3);color:var(--text)}

    /* AI result */
    .ai-img-header{font-size:11px;color:var(--text-dim);margin-bottom:6px;padding-left:2px;display:flex;align-items:center;gap:5px}
    .ai-img-header span{color:var(--accent);font-weight:600;font-size:12px}
    .ai-result-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:16px;overflow:hidden;border-bottom-left-radius:4px;max-width:300px;width:100%}
    .gen-img{width:100%;display:block;cursor:pointer;transition:opacity .2s}
    .gen-img:active{opacity:.85}
    .ai-img-footer{display:flex;align-items:center;gap:4px;padding:8px 10px;border-top:1px solid var(--border)}
    .img-action-btn{display:flex;align-items:center;font-size:15px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:5px 8px;border-radius:8px;transition:background .12s,color .12s}
    .img-action-btn:active{background:var(--surface3);color:var(--text)}
    .ai-img-time{font-size:11px;color:var(--text-dim);margin-left:auto}

    /* ── GENERATING ANIMATION ── */
    .generating-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:16px;overflow:hidden;border-bottom-left-radius:4px;width:280px;aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
    .shimmer-bg{position:absolute;inset:0;background:linear-gradient(110deg,var(--surface2) 30%,rgba(239,119,34,.07) 50%,var(--surface2) 70%);background-size:200% 100%;animation:shimmer 1.8s ease-in-out infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .orbit-ring{width:72px;height:72px;border-radius:50%;border:2px solid rgba(239,119,34,.2);position:relative;z-index:1;animation:spin 2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .orbit-ring::before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);top:-5px;left:50%;transform:translateX(-50%);box-shadow:0 0 12px var(--accent)}
    .orbit-inner{position:absolute;inset:8px;border-radius:50%;border:1.5px solid rgba(239,119,34,.25);animation:spin 1.4s linear infinite reverse}
    .gen-label{font-size:13px;color:var(--text-muted);z-index:1;letter-spacing:.3px}
    .gen-dots span{display:inline-block;animation:dot 1.2s ease-in-out infinite}
    .gen-dots span:nth-child(2){animation-delay:.2s}
    .gen-dots span:nth-child(3){animation-delay:.4s}
    @keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}

    /* ── INPUT AREA ── */
    .input-wrap{flex-shrink:0;padding:6px 10px 14px;background:var(--bg)}
    .attach-previews{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
    .preview-chip{position:relative;display:inline-flex}
    .preview-chip img{max-height:70px;border-radius:9px;border:1px solid var(--border)}
    .preview-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);border:none;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .input-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:12px 12px 8px 14px;transition:border-color .2s;display:flex;flex-direction:column;gap:10px;width:100%}
    .input-box:focus-within{border-color:rgba(239,119,34,.45)}
    .input-textarea-row{display:flex;align-items:flex-start;width:100%}
    #prompt-input{flex:1;width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;resize:none;max-height:140px;min-height:44px;line-height:1.6;padding:0}
    #prompt-input::placeholder{color:var(--text-dim)}
    .input-action-row{display:flex;align-items:center;justify-content:space-between;width:100%}
    .input-left-btns{display:flex;align-items:center;gap:6px}
    .attach-img-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s,color .15s}
    .attach-img-btn:active{background:var(--surface3);color:var(--accent)}
    #ref-input{display:none}
    .send-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;opacity:.3;pointer-events:none;transition:opacity .18s,transform .12s}
    .send-btn.enabled{opacity:1;pointer-events:all}
    .send-btn.enabled:active{transform:scale(.93)}
    .send-btn.locked{opacity:.3!important;pointer-events:none!important}

    /* ── FULLSCREEN VIEWER ── */
    .img-viewer{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .img-viewer.show{opacity:1;pointer-events:all}
    .img-viewer img{max-width:95vw;max-height:88dvh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .viewer-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .viewer-close:active{background:rgba(255,255,255,.2)}
    .viewer-dl{position:absolute;bottom:24px;right:24px;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:25px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s;box-shadow:0 4px 16px var(--accent-glow)}
    .viewer-dl:active{background:#f08535}
  </style>
</head>
<body>
<div id="app">

  <div class="overlay" id="overlay" onclick="handleOverlayClick()"></div>

  <!-- ── SIDEBAR ── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-top-title">Menu</span>
      <button class="icon-btn" onclick="closeSidebar()"><i class="fi fi-rr-cross-small"></i></button>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-action-btn primary" onclick="newSession()">
        <i class="fi fi-rr-comment-medical"></i> New Chat
      </button>
      <button class="sidebar-action-btn" onclick="openGalleryPanel()">
        <i class="fi fi-rr-picture"></i> My Images
      </button>
      <a class="sidebar-action-btn" href="about.html">
        <i class="fi fi-rr-info"></i> About
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="search-wrap">
      <div class="search-inner">
        <i class="fi fi-rr-search"></i>
        <input type="text" id="chatSearch" placeholder="Search chats…" oninput="filterChats(this.value)" autocomplete="off">
      </div>
    </div>
    <ul class="chats-list" id="chatsList"></ul>
  </div>

  <!-- ── GALLERY PANEL ── -->
  <div class="gallery-panel" id="galleryPanel">
    <div class="gallery-top">
      <button class="icon-btn" onclick="closeGalleryPanel()"><i class="fi fi-rr-arrow-left"></i></button>
      <span>My Images</span>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- Shared context menu -->
  <div class="ctx-menu" id="ctxMenu"></div>
  <!-- Header dropdown -->
  <div class="header-ctx-menu" id="headerCtxMenu"></div>

  <!-- Fullscreen viewer -->
  <div class="img-viewer" id="imgViewer" onclick="closeViewer(event)">
    <button class="viewer-close" onclick="closeViewer(null,true)"><i class="fi fi-rr-cross-small"></i></button>
    <img id="viewerImg" src="" alt="">
    <button class="viewer-dl" id="viewerDlBtn"><i class="fi fi-rr-download"></i> Save</button>
  </div>

  <!-- ── HEADER ── -->
  <header>
    <div class="header-side">
      <button class="icon-btn" id="chatsBtn" onclick="toggleSidebar()">
        <i class="fi fi-rr-bars-staggered"></i>
      </button>
    </div>
    <div class="logo">Zeni</div>
    <div class="header-side header-right">
      <button class="icon-btn" id="headerNewChatBtn" onclick="newSession()">
        <i class="fi fi-rr-comment-medical"></i>
      </button>
      <button class="icon-btn" id="headerMenuBtn" onclick="toggleHeaderMenu()">
        <i class="fi fi-rr-menu-dots-vertical"></i>
      </button>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <main>
    <div class="canvas-area" id="canvasArea">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon-box">
          <i class="fi fi-rr-graphic-style" style="color:#fff;"></i>
        </div>
        <h2>Create Images</h2>
        <p>Type what you want to see. Zeni will generate it for you.</p>
        <div class="suggestion-chips">
          <div class="chip" onclick="useChip(this)">🌆 Futuristic city at sunset</div>
          <div class="chip" onclick="useChip(this)">🦊 A fox wearing a hoodie</div>
          <div class="chip" onclick="useChip(this)">☕ Cozy rainy day cafe</div>
          <div class="chip" onclick="useChip(this)">🌊 Giant wave at golden hour</div>
          <div class="chip" onclick="useChip(this)">🚀 Astronaut in a jungle</div>
          <div class="chip" onclick="useChip(this)">🐉 Dragon in the clouds</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <div class="input-wrap">
      <div class="attach-previews" id="attachPreviews"></div>
      <div class="input-box">
        <div class="input-textarea-row">
          <textarea id="prompt-input" placeholder="Describe your image…" rows="1"
            oninput="onInput()" onkeydown="onKeyDown(event)"></textarea>
        </div>
        <div class="input-action-row">
          <div class="input-left-btns">
            <button class="attach-img-btn" onclick="document.getElementById('ref-input').click()" title="Add reference image">
              <i class="fi fi-rr-picture"></i>
            </button>
            <input type="file" id="ref-input" accept="image/*" onchange="handleRefImage(event)">
          </div>
          <button class="send-btn" id="sendBtn" onclick="generate()">
            <i class="fi fi-rr-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let sessions      = JSON.parse(localStorage.getItem('zeni_img_sessions') || '[]');
let currentId     = null;
let pendingId     = null;
let ctxTargetId   = null;
let generating    = false;
let refImageData  = null;

// ══════════════════════════════════════════════════
// PERSIST
// ══════════════════════════════════════════════════
const saveSessions   = () => localStorage.setItem('zeni_img_sessions', JSON.stringify(sessions));
const getCurrentSession = () => sessions.find(s => s.id === currentId) || null;

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function formatDate(ts){
  const d=Date.now()-ts,MIN=60000,HR=3600000,DAY=86400000;
  if(d<MIN) return 'Just now';
  if(d<HR)  return `${Math.floor(d/MIN)} min ago`;
  if(d<4*HR) return `${Math.floor(d/HR)}h ago`;
  if(d<DAY) return 'Today';
  if(d<2*DAY) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function scrollBottom(){ const c=document.getElementById('canvasArea'); requestAnimationFrame(()=>{ c.scrollTop=c.scrollHeight; }); }

// ══════════════════════════════════════════════════
// OVERLAY
// ══════════════════════════════════════════════════
const showOverlay = () => document.getElementById('overlay').classList.add('show');
const hideOverlay = () => document.getElementById('overlay').classList.remove('show');
function handleOverlayClick(){
  if(document.getElementById('galleryPanel').classList.contains('open')){ closeGalleryPanel(); return; }
  closeSidebar(); closeAllMenus();
}

// ══════════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════════
function toggleSidebar(){
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
}
function openSidebar(){
  renderChatsList();
  document.getElementById('chatSearch').value='';
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('chatsBtn').classList.add('active');
  showOverlay();
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('chatsBtn').classList.remove('active');
  if(!document.getElementById('galleryPanel').classList.contains('open')) hideOverlay();
}

function renderChatsList(filter=''){
  const list=document.getElementById('chatsList');
  list.innerHTML='';
  const q=filter.toLowerCase();
  const filtered=q ? sessions.filter(s=>s.name.toLowerCase().includes(q)) : sessions;
  if(!filtered.length){
    list.innerHTML=`<li style="padding:20px 14px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7;">${q?'No results.':'No chats yet.<br>Create an image!'}</li>`;
    return;
  }
  filtered.forEach(s=>{
    const li=document.createElement('li');
    li.className='chat-item'+(s.id===currentId?' active':'');
    li.innerHTML=`
      <div class="chat-info" onclick="openSession('${s.id}')">
        <div class="chat-name">${esc(s.name)}</div>
        <div class="chat-date">${formatDate(s.updatedAt)}</div>
      </div>
      <button class="chat-menu-btn" onclick="openCtxMenu(event,'${s.id}')">
        <i class="fi fi-rr-menu-dots-vertical"></i>
      </button>`;
    list.appendChild(li);
  });
}

function filterChats(val){ renderChatsList(val); }

// ══════════════════════════════════════════════════
// GALLERY PANEL
// ══════════════════════════════════════════════════
function openGalleryPanel(){
  renderGallery();
  document.getElementById('galleryPanel').classList.add('open');
  showOverlay();
  closeSidebar();
}
function closeGalleryPanel(){
  document.getElementById('galleryPanel').classList.remove('open');
  // reopen sidebar
  openSidebar();
}

function renderGallery(){
  const grid=document.getElementById('galleryGrid');
  grid.innerHTML='';
  // collect all generated images across all sessions
  const allImgs=[];
  sessions.forEach(s=>{
    (s.messages||[]).forEach(m=>{
      if(m.role==='ai' && m.imageUrl){
        allImgs.push({ imageUrl:m.imageUrl, prompt:m.prompt||s.name, ts:m.ts, sessionId:s.id });
      }
    });
  });
  allImgs.sort((a,b)=>b.ts-a.ts);
  if(!allImgs.length){
    grid.innerHTML=`<div class="gallery-empty">No images yet.<br>Start generating!</div>`;
    return;
  }
  allImgs.forEach(img=>{
    const div=document.createElement('div');
    div.className='gallery-thumb';
    div.innerHTML=`
      <img src="${esc(img.imageUrl)}" alt="${esc(img.prompt)}" loading="lazy">
      <div class="gallery-thumb-info">${formatDate(img.ts)}</div>`;
    div.onclick=()=>{ openSession(img.sessionId); closeGalleryPanel(); closeSidebar(); };
    grid.appendChild(div);
  });
}

// ══════════════════════════════════════════════════
// NEW SESSION / OPEN SESSION
// ══════════════════════════════════════════════════
function newSession(){
  pendingId=genId(); currentId=null;
  document.getElementById('messages').innerHTML='';
  document.getElementById('welcomeScreen').classList.remove('hidden');
  updateHeaderBtns(); renderChatsList(); closeSidebar(); closeAllMenus();
  setTimeout(()=>document.getElementById('prompt-input').focus(),300);
}

function openSession(id){
  pendingId=null; currentId=id;
  renderMessages(); renderChatsList(); updateHeaderBtns(); updateHeaderMenuContent(); closeSidebar();
}

// ══════════════════════════════════════════════════
// RENDER MESSAGES
// ══════════════════════════════════════════════════
function renderMessages(){
  const session=getCurrentSession();
  const msgEl=document.getElementById('messages');
  msgEl.innerHTML='';
  if(!session||!session.messages||!session.messages.length){
    document.getElementById('welcomeScreen').classList.remove('hidden'); return;
  }
  document.getElementById('welcomeScreen').classList.add('hidden');
  session.messages.forEach(m=>{
    if(m.role==='user') buildUserEl(m);
    else buildAIEl(m);
  });
  scrollBottom();
}

// ══════════════════════════════════════════════════
// BUILD MESSAGE ELEMENTS
// ══════════════════════════════════════════════════
function buildUserEl(m){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className='msg user';
  wrap.dataset.prompt=m.content||'';
  let content='';
  if(m.refImage) content+=`<img class="ref-img" src="${m.refImage}" alt="ref">`;
  if(m.content)  content+=esc(m.content).replace(/\n/g,'<br>');
  wrap.innerHTML=`
    <div class="msg-bubble" onclick="toggleMeta(this.parentElement)">${content}</div>
    <div class="user-msg-meta">
      <span class="user-msg-time">${fmtTime(m.ts||Date.now())}</span>
      <button class="copy-btn-small" onclick="copyPromptBtn(event,this)"><i class="fi fi-rr-copy"></i></button>
    </div>`;
  msgEl.appendChild(wrap);
  return wrap;
}

function buildAIEl(m){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className='msg ai';
  const elapsed=(m.elapsed!==undefined&&m.elapsed!==null)?` • ${m.elapsed}s`:'';
  if(m.error){
    wrap.innerHTML=`
      <div class="ai-img-header"><span>Zeni</span><span style="color:var(--text-dim)">${elapsed}</span></div>
      <div class="ai-result-wrap" style="padding:16px;">
        <div style="font-size:14px;color:var(--text-muted);line-height:1.6;">⚠️ Something went wrong. Please check your API key and try again.</div>
      </div>`;
  } else {
    const imgSrc=esc(m.imageUrl||'');
    const prompt=esc(m.prompt||'');
    wrap.innerHTML=`
      <div class="ai-img-header"><span>Zeni</span><span style="color:var(--text-dim)">${elapsed}</span></div>
      <div class="ai-result-wrap">
        <img class="gen-img" src="${imgSrc}" alt="${prompt}" onclick="openViewer('${imgSrc}','${prompt}')">
        <div class="ai-img-footer">
          <button class="img-action-btn" title="Download" onclick="downloadImage('${imgSrc}','${prompt}')"><i class="fi fi-rr-download"></i></button>
          <button class="img-action-btn" title="Copy prompt" onclick="copyImgPrompt(event,this,'${prompt}')"><i class="fi fi-rr-copy"></i></button>
          <button class="img-action-btn" title="Regenerate" onclick="regenPrompt('${prompt}')"><i class="fi fi-rr-refresh"></i></button>
          <span class="ai-img-time">${fmtTime(m.ts||Date.now())}</span>
        </div>
      </div>`;
  }
  msgEl.appendChild(wrap);
  return wrap;
}

function toggleMeta(wrap){ wrap.classList.toggle('show-meta'); }

function copyPromptBtn(e,btn){
  e.stopPropagation();
  navigator.clipboard.writeText(btn.closest('.msg').dataset.prompt||'').then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>';
    setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}

function copyImgPrompt(e,btn,prompt){
  e.stopPropagation();
  navigator.clipboard.writeText(prompt).then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>';
    setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}

function regenPrompt(prompt){
  document.getElementById('prompt-input').value=prompt;
  onInput();
}

// ══════════════════════════════════════════════════
// GENERATE
// ══════════════════════════════════════════════════
async function generate(){
  const input=document.getElementById('prompt-input');
  const promptText=input.value.trim();
  if((!promptText && !refImageData)||generating) return;

  generating=true; lockSend(true);
  const now=Date.now();

  // Create session on first message
  if(!currentId){
    const id=pendingId||genId(); pendingId=null;
    sessions.unshift({id, name:promptText.slice(0,42)||'Image Chat', messages:[], createdAt:now, updatedAt:now});
    currentId=id; saveSessions(); updateHeaderBtns(); updateHeaderMenuContent();
  }

  const session=getCurrentSession();
  const uMsg={role:'user', content:promptText, refImage:refImageData, ts:now};
  session.messages.push(uMsg); session.updatedAt=now; saveSessions();

  // Clear input
  input.value=''; input.style.height='auto'; removeRef(); toggleSend();

  buildUserEl(uMsg); scrollBottom();
  const genEl=renderGenerating(); scrollBottom();

  const startMs=Date.now();
  try {
    const imageUrl=await callImageAPI(promptText, refImageData);
    const elapsed=Math.round((Date.now()-startMs)/1000);
    const aiMsg={role:'ai', imageUrl, prompt:promptText, elapsed, ts:Date.now()};
    session.messages.push(aiMsg); session.updatedAt=Date.now(); saveSessions();
    genEl.remove(); buildAIEl(aiMsg); scrollBottom();
    renderChatsList();
  } catch(err){
    const aiMsg={role:'ai', error:true, prompt:promptText, ts:Date.now()};
    session.messages.push(aiMsg); session.updatedAt=Date.now(); saveSessions();
    genEl.remove(); buildAIEl(aiMsg); scrollBottom();
  }

  generating=false; lockSend(false);
}

function lockSend(lock){
  const btn=document.getElementById('sendBtn');
  lock ? btn.classList.add('locked') : btn.classList.remove('locked');
}

function renderGenerating(){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  const wrap=document.createElement('div');
  wrap.className='msg ai';
  wrap.innerHTML=`
    <div class="ai-img-header"><span>Zeni</span> <span style="color:var(--text-dim)">generating</span></div>
    <div class="generating-wrap">
      <div class="shimmer-bg"></div>
      <div class="orbit-ring"><div class="orbit-inner"></div></div>
      <div class="gen-label">Creating your image<span class="gen-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>`;
  msgEl.appendChild(wrap);
  return wrap;
}

// ══════════════════════════════════════════════════
// API — /api/image (image.js backend, Google AI Studio)
// ══════════════════════════════════════════════════
async function callImageAPI(prompt, refImage){
  const body={ prompt };
  if(refImage) body.refImage=refImage;
  const res=await fetch('/api/image',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!res.ok) throw new Error('API '+res.status);
  const data=await res.json();
  if(!data.imageUrl) throw new Error('No image');
  return data.imageUrl;
}

// ══════════════════════════════════════════════════
// INPUT HANDLERS
// ══════════════════════════════════════════════════
function onInput(){
  const ta=document.getElementById('prompt-input');
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,140)+'px';
  toggleSend();
}
function onKeyDown(e){
  if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>600){ e.preventDefault(); generate(); }
}
function toggleSend(){
  const btn=document.getElementById('sendBtn');
  const val=document.getElementById('prompt-input').value.trim();
  (val||refImageData) ? btn.classList.add('enabled') : btn.classList.remove('enabled');
}
function useChip(el){
  // Remove emoji prefix for prompt
  const text=el.textContent.replace(/^[\u{1F300}-\u{1FFFF}\u{2600}-\u{27BF}] /u,'');
  document.getElementById('prompt-input').value=text;
  onInput(); document.getElementById('prompt-input').focus();
}

// ══════════════════════════════════════════════════
// REFERENCE IMAGE
// ══════════════════════════════════════════════════
function handleRefImage(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{ refImageData=ev.target.result; renderAttachPreview(); toggleSend(); };
  reader.readAsDataURL(file); e.target.value='';
}
function renderAttachPreview(){
  const wrap=document.getElementById('attachPreviews'); wrap.innerHTML='';
  if(!refImageData) return;
  const chip=document.createElement('div'); chip.className='preview-chip';
  chip.innerHTML=`<img src="${refImageData}" alt="ref"><button class="preview-remove" onclick="removeRef()"><i class="fi fi-rr-cross"></i></button>`;
  wrap.appendChild(chip);
}
function removeRef(){ refImageData=null; renderAttachPreview(); toggleSend(); }

// ══════════════════════════════════════════════════
// HEADER BUTTONS
// ══════════════════════════════════════════════════
function updateHeaderBtns(){
  const active=!!(currentId&&getCurrentSession());
  document.getElementById('headerNewChatBtn').classList.toggle('visible',active);
  document.getElementById('headerMenuBtn').classList.toggle('visible',active);
  if(!active) document.getElementById('headerCtxMenu').classList.remove('show');
}

function updateHeaderMenuContent(){
  const menu=document.getElementById('headerCtxMenu');
  const s=getCurrentSession(); if(!s){ menu.innerHTML=''; return; }
  menu.innerHTML=`
    <div class="ctx-label">${esc(s.name)}</div>
    <button class="ctx-item" onclick="headerAction('rename')"><i class="fi fi-rr-pencil"></i> Rename</button>
    <a class="ctx-item" href="report.html" onclick="closeAllMenus()"><i class="fi fi-rr-flag"></i> Report</a>
    <button class="ctx-item danger" onclick="headerAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" onclick="newSession()"><i class="fi fi-rr-comment-medical"></i> New Chat</button>`;
}

function toggleHeaderMenu(){
  const menu=document.getElementById('headerCtxMenu'); if(!getCurrentSession()) return;
  if(menu.classList.contains('show')) menu.classList.remove('show');
  else { updateHeaderMenuContent(); closeAllMenus(menu); menu.classList.add('show'); }
}

function headerAction(action){
  ctxTargetId=currentId;
  document.getElementById('headerCtxMenu').classList.remove('show');
  ctxAction(action);
}

// ══════════════════════════════════════════════════
// CONTEXT MENU (sidebar)
// ══════════════════════════════════════════════════
function openCtxMenu(e,id){
  e.stopPropagation(); ctxTargetId=id;
  const s=sessions.find(x=>x.id===id); if(!s) return;
  const menu=document.getElementById('ctxMenu'); closeAllMenus(menu);
  menu.innerHTML=`
    <div class="ctx-label">${esc(s.name)}</div>
    <button class="ctx-item" onclick="ctxAction('rename')"><i class="fi fi-rr-pencil"></i> Rename</button>
    <button class="ctx-item danger" onclick="ctxAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>`;
  const rect=e.currentTarget.getBoundingClientRect();
  const mW=170,mH=130;
  let top=rect.bottom+4, left=rect.left-mW+rect.width;
  if(top+mH>window.innerHeight) top=rect.top-mH-4;
  if(left<8) left=8;
  if(left+mW>window.innerWidth) left=window.innerWidth-mW-8;
  menu.style.top=top+'px'; menu.style.left=left+'px';
  menu.classList.add('show');
}

function ctxAction(action){
  const s=sessions.find(x=>x.id===ctxTargetId);
  if(!s){ closeAllMenus(); return; }
  if(action==='rename'){
    const name=prompt('Rename:',s.name);
    if(name&&name.trim()){ s.name=name.trim(); saveSessions(); renderChatsList(); if(currentId===ctxTargetId) updateHeaderMenuContent(); }
  } else if(action==='delete'){
    if(!confirm(`Delete "${s.name}"?`)){ closeAllMenus(); return; }
    sessions=sessions.filter(x=>x.id!==ctxTargetId); saveSessions();
    if(currentId===ctxTargetId){ currentId=null; document.getElementById('messages').innerHTML=''; document.getElementById('welcomeScreen').classList.remove('hidden'); updateHeaderBtns(); updateHeaderMenuContent(); }
    renderChatsList();
  }
  closeAllMenus();
}

// ══════════════════════════════════════════════════
// IMAGE VIEWER
// ══════════════════════════════════════════════════
function openViewer(url,prompt){
  document.getElementById('viewerImg').src=url;
  document.getElementById('viewerDlBtn').onclick=()=>downloadImage(url,prompt);
  document.getElementById('imgViewer').classList.add('show');
}
function closeViewer(e,force){
  if(force||!e||e.target===document.getElementById('imgViewer'))
    document.getElementById('imgViewer').classList.remove('show');
}
function downloadImage(url,name){
  const a=document.createElement('a');
  a.href=url; a.download=(name||'zeni-image').slice(0,40)+'.png';
  a.target='_blank'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ══════════════════════════════════════════════════
// CLOSE ALL MENUS
// ══════════════════════════════════════════════════
function closeAllMenus(except){
  ['ctxMenu','headerCtxMenu'].forEach(id=>{
    const el=document.getElementById(id);
    if(el!==except) el.classList.remove('show');
  });
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.ctx-menu,.chat-menu-btn,.header-ctx-menu,#headerMenuBtn'))
    closeAllMenus();
});

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
updateHeaderBtns();
updateHeaderMenuContent();
</script>
</body>
</html>
