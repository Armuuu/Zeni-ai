<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeni</title>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #141414;
      --surface: #1e1e1e;
      --surface2: #272727;
      --surface3: #323232;
      --border: rgba(255,255,255,0.08);
      --accent: #EF7722;
      --accent-dim: rgba(239,119,34,0.12);
      --text: #f0f0f0;
      --text-muted: #888;
      --text-dim: #505050;
      --sidebar-w: 285px;
      --header-h: 54px;
      --danger: #e05555;
      --ai-bubble: rgba(239,119,34,0.25);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── APP SHELL ─── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* ─── HEADER ─── */
    header {
      height: var(--header-h);
      min-height: var(--header-h);
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      position: relative;
      z-index: 100;
      flex-shrink: 0;
    }

    .header-side {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 80px;
    }
    .header-right { justify-content: flex-end; }

    .logo {
      font-family: 'Sora', sans-serif;
      font-size: 27px;
      font-weight: 700;
      background: linear-gradient(135deg, #f4a96a, #EF7722);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    .header-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .welcome-area {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .welcome-area.hidden { display: none; }

    .welcome-icon { font-size: 18px; color: var(--accent); }

    .welcome-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .incognito-indicator {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.15s, color 0.15s, opacity 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:active { background: var(--surface3); }
    .icon-btn.active { background: var(--accent-dim); color: var(--accent); }

    #headerNewChatBtn,
    #headerMenuBtn,
    #incognitoBtn {
      opacity: 0;
      pointer-events: none;
    }
    #headerNewChatBtn.visible,
    #headerMenuBtn.visible,
    #incognitoBtn.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* ─── OVERLAY ─── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .overlay.show { opacity: 1; pointer-events: all; }

    /* ─── SIDEBAR ─── */
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: var(--sidebar-w);
      max-width: 90vw;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 300;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.27s cubic-bezier(0.4,0,0.2,1);
      will-change: transform;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-top {
      height: var(--header-h);
      min-height: var(--header-h);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-top-title {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .sidebar-actions {
      padding: 10px 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .sidebar-action-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      text-align: left;
      width: 100%;
      text-decoration: none;
    }
    .sidebar-action-btn:active { background: var(--surface3); }
    .sidebar-action-btn i { font-size: 16px; flex-shrink: 0; }
    .sidebar-action-btn.primary {
      color: var(--accent);
      font-weight: 500;
    }

    .sidebar-action-btn.primary:active {
      background-color: var(--accent-dim);
    }
    .sidebar-action-btn.primary i { color: var(--accent); }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 14px;
      flex-shrink: 0;
    }

    .search-bar {
      padding: 8px 10px;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { border-color: rgba(239,119,34,0.5); }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 4px 10px 10px;
      list-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .chats-list::-webkit-scrollbar { display: none; }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 10px 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      gap: 4px;
      transition: background 0.12s;
    }
    .chat-item:active { background: var(--surface2); }
    .chat-item.active { background: var(--accent-dim); }

    .chat-pin-icon {
      font-size: 12px;
      color: var(--accent);
      flex-shrink: 0;
      margin-right: 2px;
    }

    .chat-info { flex: 1; min-width: 0; }

    .chat-name {
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .chat-item.active .chat-name { color: var(--accent); }

    .chat-date {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .chat-menu-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      opacity: 1;
      transition: background 0.12s, color 0.12s;
    }
    .chat-menu-btn:active { background: var(--surface3); color: var(--text); }

    /* ─── CONTEXT MENU ─── */
    .ctx-menu {
      position: fixed;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 6px;
      min-width: 160px;
      max-width: 160px;
      z-index: 500;
      box-shadow: 0 10px 36px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.93);
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s;
      transform-origin: top left;
    }

    .ctx-menu.show { opacity: 1; transform: scale(1); pointer-events: all; }

    .ctx-label {
      padding: 8px 12px 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.12s;
      text-decoration: none;
    }
    .ctx-item:active { background: var(--surface3); }
    .ctx-item.danger { color: var(--danger); }
    .ctx-item.danger:active { background: rgba(224,85,85,0.12); }
    .ctx-item i { font-size: 15px; width: 18px; flex-shrink: 0; }

    /* ─── HEADER CTX MENU ─── */
    .header-ctx-menu {
      position: fixed;
      top: calc(var(--header-h) + 5px);
      right: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 6px;
      min-width: 190px;
      max-width: 190px;
      z-index: 500;
      box-shadow: 0 10px 36px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.93) translateY(-4px);
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s;
      transform-origin: top right;
    }
    .header-ctx-menu.show { opacity: 1; transform: scale(1) translateY(0); pointer-events: all; }

    .ctx-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 8px;
    }

    /* ─��─ MODEL SELECTOR ─── */
    .model-selector {
      position: fixed;
      bottom: calc(var(--header-h) + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 6px;
      min-width: 240px;
      z-index: 400;
      box-shadow: 0 10px 36px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s, transform 0.14s;
    }

    .model-selector.show { opacity: 1; pointer-events: all; }

    .model-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.12s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
    }

    .model-option:active { background: var(--surface3); }

    .model-option-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--text-dim);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }

    .model-option.selected .model-option-radio {
      border-color: var(--accent);
    }

    .model-option.selected .model-option-radio::after {
      content: '✓';
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .model-info strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .model-option.selected .model-info strong { color: var(--accent); }

    .model-info span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ─── AUDIO CONTROLLER ─── */
    .audio-controller {
      position: fixed;
      bottom: calc(var(--header-h) + 80px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 12px 16px;
      z-index: 400;
      box-shadow: 0 10px 36px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .audio-controller.show {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }

    .audio-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .audio-play-btn:active { opacity: 0.85; }

    .voice-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
    }

    .voice-bar {
      width: 2px;
      background: var(--accent);
      border-radius: 1px;
      animation: voiceBar 0.4s ease-in-out infinite;
    }

    .voice-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .voice-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
    .voice-bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }
    .voice-bar:nth-child(4) { height: 18px; animation-delay: 0.3s; }
    .voice-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

    @keyframes voiceBar {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .audio-close-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.12s, color 0.12s;
    }

    .audio-close-btn:active { background: var(--surface3); color: var(--text); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 11px 16px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 999;
      max-width: 280px;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: all;
    }

    .toast a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* ─── ARCHIVE PANEL ─── */
    .archive-panel {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: var(--sidebar-w);
      max-width: 90vw;
      background: var(--surface);
      border-right: 1px solid var(--border);
      z-index: 350;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.27s cubic-bezier(0.4,0,0.2,1);
    }
    .archive-panel.open { transform: translateX(0); }

    .archive-top {
      height: var(--header-h);
      min-height: var(--header-h);
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .archive-top span {
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .archive-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      list-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .archive-list::-webkit-scrollbar { display: none; }

    .archive-item {
      display: flex;
      align-items: center;
      padding: 10px 10px 10px 12px;
      border-radius: 10px;
      gap: 4px;
    }
    .archive-item:active { background: var(--surface2); }
    .archive-info { flex: 1; min-width: 0; cursor: pointer; }
    .archive-name {
      font-size: 13.5px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .archive-date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

    .unarchive-btn {
      width: 30px; height: 30px;
      border-radius: 8px; border: none;
      background: transparent; color: var(--text-dim);
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
      transition: background 0.12s, color 0.12s;
    }
    .unarchive-btn:active { background: var(--surface3); color: var(--accent); }

    /* ─── MAIN ─── */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 14px 10px;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }
    .chat-area::-webkit-scrollbar { display: none; }

    /* ─── WELCOME ─── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-bottom: 30px;
      text-align: center;
    }
    .welcome.hidden { display: none; }

    .welcome-icon-box {
      width: 65px;
      height: 65px;
      border-radius: 18px;
      background: var(--accent);
      border: 1px solid var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 6px;
    }

    .welcome h2 {
      font-family: 'Sora', sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
    }

    .welcome p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 260px;
      line-height: 1.65;
    }

    /* ─── MESSAGES ─── */
    .messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      display: flex;
      max-width: 86%;
      animation: msgIn 0.2s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; justify-content: flex-end; }
    .msg.ai   { align-self: flex-start; }

    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg.user .msg-content { align-items: flex-end; }
    .msg.ai .msg-content { align-items: flex-start; }

    .msg-agent-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
      padding: 0 2px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.65;
      word-break: break-word;
      position: relative;
    }
    .msg.user .msg-bubble {
      background: var(--accent-dim);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-right-radius: 4px;
    }
    .msg.ai .msg-bubble {
      background: var(--ai-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble img {
      max-width: 200px;
      border-radius: 10px;
      margin-bottom: 6px;
      display: block;
    }

    .msg-utilities {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-top: 6px;
      padding: 0 4px;
    }

    .msg.user .msg-utilities { flex-direction: row-reverse; }

    .msg-time {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .msg-util-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }

    .msg-util-btn:active { background: var(--surface3); color: var(--accent); }
    .msg-util-btn.active { color: var(--accent); }

    /* ─── TYPING ─── */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 0;
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: tDot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tDot {

<script>

// ═══════════════════════════════════════════
// STATE & CONFIG
// ═══════════════════════════════════════════
let chats         = JSON.parse(localStorage.getItem('zeni_chats')    || '[]');
let archived      = JSON.parse(localStorage.getItem('zeni_archived') || '[]');
let currentChatId = null;
let pendingChatId = null;
let ctxTargetId   = null;
let ctxSource     = 'chats';
let selectedAttachment = null;
let incognitoMode = false;
let incognitoMessages = [];
let selectedModel = localStorage.getItem('zeni_selectedModel') || 'qwen';
let isAISending = false;
let currentAudioContext = null;

// ═══════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════
const saveChats      = () => localStorage.setItem('zeni_chats',    JSON.stringify(chats));
const saveArchived   = () => localStorage.setItem('zeni_archived', JSON.stringify(archived));
const saveModel      = () => localStorage.setItem('zeni_selectedModel', selectedModel);
const getCurrentChat = () => {
  if (incognitoMode) return null;
  return chats.find(c => c.id === currentChatId) || null;
};

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(ts) {
  const diff = Date.now() - ts;
  const MIN=60000, HR=3600000, DAY=86400000;
  if (diff < MIN)   return 'Just now';
  if (diff < HR)    return `${Math.floor(diff/MIN)} min ago`;
  if (diff < 4*HR)  return `${Math.floor(diff/HR)}h ago`;
  if (diff < DAY)   return 'Today';
  if (diff < 2*DAY) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
}

function sortChats() {
  chats.sort((a, b) => {
    const aPinned = a.pinned || false;
    const bPinned = b.pinned || false;
    if (aPinned !== bPinned) return bPinned - aPinned;
    return b.updatedAt - a.updatedAt;
  });
}

function showToast(msg, duration = 6000) {
  const toast = document.getElementById('toast');
  toast.innerHTML = msg;
  toast.classList.add('show');
  setTimeout(() => { toast.classList.remove('show'); }, duration);
}

// ═══════════════════════════════════════════
// INCOGNITO MODE
// ═══════════════════════════════════════════
function toggleIncognito() {
  incognitoMode = !incognitoMode;
  const btn = document.getElementById('incognitoBtn');
  const welcomeArea = document.getElementById('welcomeArea');
  const incognitoInd = document.getElementById('incognitoIndicator');

  if (incognitoMode) {
    btn.classList.add('active');
    welcomeArea.classList.add('hidden');
    incognitoInd.classList.remove('hidden');
    incognitoMessages = [];
    currentChatId = null;
    pendingChatId = null;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('welcomeScreen').classList.remove('hidden');
    updateHeaderBtns();
  } else {
    btn.classList.remove('active');
    welcomeArea.classList.remove('hidden');
    incognitoInd.classList.add('hidden');
    incognitoMessages = [];
    currentChatId = null;
    pendingChatId = null;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('welcomeScreen').classList.remove('hidden');
    updateHeaderBtns();
  }
}

// ═══════════════════════════════════════════
// OVERLAY
// ═══════════════════════════════════════════
const showOverlay = () => document.getElementById('overlay').classList.add('show');
const hideOverlay = () => document.getElementById('overlay').classList.remove('show');

function handleOverlayClick() {
  closeArchivePanel();
  closeSidebar();
  closeAllMenus();
}

// ═══════════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════════
function toggleSidebar() {
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
}

function openSidebar() {
  renderChatsList();
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('chatsBtn').classList.add('active');
  showOverlay();
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('chatsBtn').classList.remove('active');
  if (!document.getElementById('archivePanel').classList.contains('open')) hideOverlay();
}

function filterChats() {
  const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
  const list = document.getElementById('chatsList');
  const items = list.querySelectorAll('.chat-item');

  items.forEach(item => {
    const name = item.querySelector('.chat-name').textContent.toLowerCase();
    if (searchText === '' || name.includes(searchText)) {
      item.style.display = 'flex';
    } else {
      item.style.display = 'none';
    }
  });
}

function renderChatsList() {
  const list = document.getElementById('chatsList');
  list.innerHTML = '';

  if (!chats.length) {
    list.innerHTML = `<li style="padding:24px 14px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7;">No chats yet.<br>Start a new one!</li>`;
    return;
  }

  sortChats();

  chats.forEach(c => {
    const li = document.createElement('li');
    li.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    const pinIcon = c.pinned ? '<span class="chat-pin-icon"><i class="fi fi-rr-bookmark"></i></span>' : '';
    li.innerHTML = `
      <div class="chat-info" onclick="openChat('${c.id}')">
        ${pinIcon}
        <div class="chat-name">${esc(c.name)}</div>
        <div class="chat-date">${formatDate(c.updatedAt)}</div>
      </div>
      <button class="chat-menu-btn" onclick="openCtxMenu(event,'${c.id}','chats')">
        <i class="fi fi-rr-menu-dots-vertical"></i>
      </button>`;
    list.appendChild(li);
  });
}

// ═══════════════════════════════════════════
// NEW CHAT
// ═══════════════════════════════════════════
function newChat() {
  if (incognitoMode) return;
  pendingChatId = genId();
  currentChatId = null;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcomeScreen').classList.remove('hidden');
  updateHeaderBtns();
  renderChatsList();
  closeSidebar();
  closeAllMenus();
  setTimeout(() => document.getElementById('msg-input').focus(), 300);
}

// ═══════════════════════════════════════════
// OPEN EXISTING CHAT
// ═══════════════════════════════════════════
function openChat(id) {
  if (incognitoMode) return;
  pendingChatId = null;
  currentChatId = id;
  renderMessages();
  renderChatsList();
  updateHeaderBtns();
  updateHeaderMenuContent();
  closeSidebar();
}

// ═══════════════════════════════════════════
// RENDER MESSAGES
// ═══════════════════════════════════════════
function renderMessages() {
  const chat    = getCurrentChat();
  const msgEl   = document.getElementById('messages');
  const welcome = document.getElementById('welcomeScreen');

  msgEl.innerHTML = '';

  if (!chat || !chat.messages || chat.messages.length === 0) {
    welcome.classList.remove('hidden');
    return;
  }

  welcome.classList.add('hidden');

  chat.messages.forEach((m, idx) => {
    const div = document.createElement('div');
    div.className = `msg ${m.role}`;
    let content = '';
    
    if (m.role === 'ai' && m.agent) {
      content += `<div class="msg-agent-label">${esc(m.agent)}</div>`;
    }

    content += '<div class="msg-content">';
    
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (m.image)   bubble.innerHTML += `<img src="${m.image}" alt="">`;
    if (m.content) bubble.innerHTML += m.content.replace(/\n/g,'<br>');
    content += bubble.outerHTML;

    // Utilities row
    if (m.role === 'user') {
      content += `<div class="msg-utilities">
        <span class="msg-time">${formatTime(m.timestamp || Date.now())}</span>
        <button class="msg-util-btn" onclick="copyMessage(event, '${esc(m.content)}')">
          <i class="fi fi-rr-copy"></i>
        </button>
      </div>`;
    } else if (m.role === 'ai') {
      content += `<div class="msg-utilities">
        <button class="msg-util-btn" onclick="copyMessage(event, '${esc(m.content)}')">
          <i class="fi fi-rr-copy"></i>
        </button>
        <button class="msg-util-btn" onclick="speakMessage('${esc(m.content)}')">
          <i class="fi fi-rr-volume"></i>
        </button>
        <button class="msg-util-btn" onclick="likeMessage(event, ${idx})">
          <i class="fi fi-rr-thumbs-up"></i>
        </button>
        <button class="msg-util-btn" onclick="unlikeMessage(event, ${idx})">
          <i class="fi fi-rr-thumbs-down"></i>
        </button>
        <span class="msg-time">${formatTime(m.timestamp || Date.now())}</span>
      </div>`;
    }

    content += '</div>';
    div.innerHTML = content;
    msgEl.appendChild(div);
  });

  scrollBottom();
}

function appendMsgEl(m) {
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl = document.getElementById('messages');
  const div   = document.createElement('div');
  div.className = `msg ${m.role}`;
  let content = '';

  if (m.role === 'ai' && m.agent) {
    content += `<div class="msg-agent-label">${esc(m.agent)}</div>`;
  }

  content += '<div class="msg-content">';
  
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (m.image)   bubble.innerHTML += `<img src="${m.image}" alt="">`;
  if (m.content) bubble.innerHTML += m.content.replace(/\n/g,'<br>');
  content += bubble.outerHTML;

  if (m.role === 'user') {
    content += `<div class="msg-utilities">
      <span class="msg-time">${formatTime(m.timestamp || Date.now())}</span>
      <button class="msg-util-btn" onclick="copyMessage(event, '${esc(m.content)}')">
        <i class="fi fi-rr-copy"></i>
      </button>
    </div>`;
  } else if (m.role === 'ai') {
    const msgIdx = document.querySelectorAll('.msg.ai').length;
    content += `<div class="msg-utilities">
      <button class="msg-util-btn" onclick="copyMessage(event, '${esc(m.content)}')">
        <i class="fi fi-rr-copy"></i>
      </button>
      <button class="msg-util-btn" onclick="speakMessage('${esc(m.content)}')">
        <i class="fi fi-rr-volume"></i>
      </button>
      <button class="msg-util-btn" onclick="likeMessage(event, ${msgIdx})">
        <i class="fi fi-rr-thumbs-up"></i>
      </button>
      <button class="msg-util-btn" onclick="unlikeMessage(event, ${msgIdx})">
        <i class="fi fi-rr-thumbs-down"></i>
      </button>
      <span class="msg-time">${formatTime(m.timestamp || Date.now())}</span>
    </div>`;
  }

  content += '</div>';
  div.innerHTML = content;
  msgEl.appendChild(div);
  return div;
}

function scrollBottom() {
  const ca = document.getElementById('chatArea');
  requestAnimationFrame(() => { ca.scrollTop = ca.scrollHeight; });
}

function copyMessage(event, text) {
  event.stopPropagation();
  navigator.clipboard.writeText(text).then(() => {
    showToast('Message copied!', 2000);
  });
}

function speakMessage(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    speechSynthesis.speak(utterance);
    showAudioController();
  }
}

function likeMessage(event, idx) {
  event.stopPropagation();
  const btn = event.target.closest('.msg-util-btn');
  btn.classList.add('active');
  showToast('Thank you for your review<br><a href="report.html" onclick="event.preventDefault(); window.open(\'report.html\');">Provide full review</a>', 7000);
}

function unlikeMessage(event, idx) {
  event.stopPropagation();
  const btn = event.target.closest('.msg-util-btn');
  btn.classList.add('active');
  showToast('Thank you for your review<br><a href="report.html" onclick="event.preventDefault(); window.open(\'report.html\');">Provide full review</a>', 7000);
}

// ════════════���══════════════════════════════
// SEND MESSAGE
// ═══════════════════════════════════════════
async function sendMessage() {
  if (isAISending) return;
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text && !selectedAttachment) return;

  isAISending = true;
  toggleSend();

  // Handle incognito mode
  if (incognitoMode) {
    const userMsg = { role:'user', content:text, image:selectedAttachment?.base64 || null, timestamp: Date.now() };
    incognitoMessages.push(userMsg);
    input.value = '';
    input.style.height = 'auto';
    removeAttachment();
    appendMsgEl(userMsg);
    scrollBottom();

    const typing = showTyping();

    try {
      const replyText = await callAI(incognitoMessages);
      const aiMsg = { role:'ai', content:replyText, agent: 'Agent ' + (selectedModel === 'deepseek' ? '2' : '1'), timestamp: Date.now() };
      incognitoMessages.push(aiMsg);
      typing.remove();
      appendMsgEl(aiMsg);
      scrollBottom();
    } catch(err) {
      const errMsg = { role:'ai', content:'⚠️ Something went wrong. Please try again later.', timestamp: Date.now() };
      incognitoMessages.push(errMsg);
      typing.remove();
      appendMsgEl(errMsg);
      scrollBottom();
    }

    isAISending = false;
    toggleSend();
    return;
  }

  // First message → create + save chat
  if (!currentChatId) {
    const id = pendingChatId || genId();
    pendingChatId = null;
    const newChatObj = {
      id,
      name: text.slice(0, 42) || 'New Chat',
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
      pinned: false
    };
    chats.unshift(newChatObj);
    currentChatId = id;
    saveChats();
    updateHeaderBtns();
    updateHeaderMenuContent();
  }

  const chat    = getCurrentChat();
  const imgData = selectedAttachment
    ? selectedAttachment.base64
    : null;

  const userMsg = { role:'user', content:text, image:imgData, timestamp: Date.now() };
  chat.messages.push(userMsg);
  chat.updatedAt = Date.now();
  saveChats();

  input.value = '';
  input.style.height = 'auto';
  removeAttachment();
  toggleSend();
  appendMsgEl(userMsg);
  scrollBottom();

  const typing = showTyping();

  try {
    const replyText = await callAI(chat.messages);
    const aiMsg = { role:'ai', content:replyText, agent: 'Agent ' + (selectedModel === 'deepseek' ? '2' : '1'), timestamp: Date.now() };

    chat.messages.push(aiMsg);
    chat.updatedAt = Date.now();
    sortChats();
    saveChats();

    typing.remove();
    appendMsgEl(aiMsg);
    scrollBottom();
    renderChatsList();
  } catch(err) {
    const errMsg = { role:'ai', content:'⚠️ Something went wrong. Please try again later.', timestamp: Date.now() };
    chat.messages.push(errMsg);
    chat.updatedAt = Date.now();
    saveChats();
    typing.remove();
    appendMsgEl(errMsg);
    scrollBottom();
  }

  isAISending = false;
  toggleSend();
}

function showTyping() {
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl = document.getElementById('messages');
  const div   = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="msg-bubble">
    <div class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>`;
  msgEl.appendChild(div);
  scrollBottom();
  return div;
}

async function callAI(messages) {
  const formatted = messages.map(m => {
    if (m.image) {
      const b64  = m.image.split(',')[1] || m.image;
      const mime = m.image.includes(';') ? m.image.split(';')[0].split(':')[1] : 'image/jpeg';
      return {
        role: m.role === 'user' ? 'user' : 'assistant',
        content: [
          { type: 'text', text: m.content || '' },
          { type: 'image', source: { type: 'base64', media_type: mime, data: b64 } }
        ]
      };
    } else {
      return {
        role: m.role === 'user' ? 'user' : 'assistant',
        content: m.content || ''
      };
    }
  });

  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: formatted, model: selectedModel })
  });

  if (!response.ok) throw new Error('API error');
  const data = await response.json();
  return data.reply || 'No response received';
}

// ═══════════════════════════════════════════
// ATTACHMENT HANDLING
// ═══════════════════════════════════════════
function togglePlusMenu() {
  closeAllMenus();
  const menu = document.getElementById('plusMenu');
  menu.classList.toggle('show');
}

function openCamera() {
  document.getElementById('camera-input').click();
  document.getElementById('plusMenu').classList.remove('show');
}

function openImage() {
  document.getElementById('image-input').click();
  document.getElementById('plusMenu').classList.remove('show');
}

function openFile() {
  document.getElementById('file-input').click();
  document.getElementById('plusMenu').classList.remove('show');
}

function goToImageTool() {
  showToast('Image tool coming soon!', 2000);
}

function handleCameraInput(event) {
  const file = event.target.files?.[0];
  if (file) handleAttachmentFile(file);
}

function handleImageInput(event) {
  const file = event.target.files?.[0];
  if (file) handleAttachmentFile(file);
}

function handleFileInput(event) {
  const file = event.target.files?.[0];
  if (file) handleAttachmentFile(file);
}

function handleAttachmentFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    selectedAttachment = {
      base64: e.target.result,
      name: file.name,
      type: file.type
    };
    displayAttachmentPreview();
  };
  reader.readAsDataURL(file);
}

function displayAttachmentPreview() {
  const preview = document.getElementById('attachmentPreview');
  const src = document.getElementById('attachmentPreviewSrc');
  if (selectedAttachment.type.startsWith('image/')) {
    src.src = selectedAttachment.base64;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

function removeAttachment() {
  selectedAttachment = null;
  document.getElementById('attachmentPreview').style.display = 'none';
  document.getElementById('image-input').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('camera-input').value = '';
}

// ═══════════════════════════════════════════
// MODEL SELECTOR
// ═══════════════════════════════════════════
function toggleModelSelector() {
  closeAllMenus();
  const selector = document.getElementById('modelSelector');
  selector.classList.toggle('show');
}

function selectModel(model) {
  selectedModel = model;
  saveModel();
  document.querySelectorAll('.model-option').forEach((opt, idx) => {
    if ((idx === 0 && model === 'qwen') || (idx === 1 && model === 'deepseek')) {
      opt.classList.add('selected');
    } else {
      opt.classList.remove('selected');
    }
  });
  closeAllMenus();
}

// ═══════════════════════════════════════════
// AUDIO CONTROLLER
// ═══════════════════════════════════════════
function showAudioController() {
  document.getElementById('audioController').classList.add('show');
}

function closeAudioController() {
  speechSynthesis.cancel();
  document.getElementById('audioController').classList.remove('show');
}

function toggleAudioPlayback() {
  const btn = document.getElementById('audioPlayBtn');
  if (speechSynthesis.paused || !speechSynthesis.speaking) {
    btn.innerHTML = '<i class="fi fi-rr-pause"></i>';
  } else {
    btn.innerHTML = '<i class="fi fi-rr-play"></i>';
  }
}

// ═══════════════════════════════════════════
// INPUT HANDLING
// ═══════════════════════════════════════════
function onInput() {
  const input = document.getElementById('msg-input');
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  toggleSend();
}

function onKeyDown(event) {
  if (event.key === 'Enter' && !event.shiftKey && document.getElementById('sendBtn').classList.contains('enabled')) {
    event.preventDefault();
    sendMessage();
  }
}

function toggleSend() {
  const input = document.getElementById('msg-input');
  const btn   = document.getElementById('sendBtn');
  const hasText = input.value.trim().length > 0;
  const hasAttachment = selectedAttachment !== null;
  
  if ((hasText || hasAttachment) && !isAISending) {
    btn.classList.add('enabled');
  } else {
    btn.classList.remove('enabled');
  }
}

// ═══════════════════════════════════════════
// CONTEXT MENU (CHAT 3-DOT)
// ═══════════════════════════════════════════
function openCtxMenu(event, id, source) {
  event.stopPropagation();
  ctxTargetId = id;
  ctxSource = source;

  const chat = source === 'chats' 
    ? chats.find(c => c.id === id)
    : archived.find(c => c.id === id);

  if (!chat) return;

  const menu = document.getElementById('ctxMenu');
  const isPinned = chat.pinned || false;

  menu.innerHTML = `
    <div class="ctx-label">${esc(chat.name)}</div>
    <button class="ctx-item" onclick="renameChat()">
      <i class="fi fi-rr-edit"></i> Rename
    </button>
    <button class="ctx-item" onclick="togglePin()">
      <i class="fi fi-rr-bookmark"></i> ${isPinned ? 'Unpin' : 'Pin'}
    </button>
    <button class="ctx-item" onclick="archiveChat()">
      <i class="fi fi-rr-box"></i> Archive
    </button>
    <button class="ctx-item danger" onclick="deleteChat()">
      <i class="fi fi-rr-trash"></i> Delete
    </button>
  `;

  const rect = event.target.getBoundingClientRect();
  menu.style.left = rect.left + 'px';
  menu.style.top = (rect.bottom + 5) + 'px';
  menu.classList.add('show');
  showOverlay();
}

function renameChat() {
  const list = ctxSource === 'chats' ? chats : archived;
  const chat = list.find(c => c.id === ctxTargetId);
  if (!chat) return;

  const newName = prompt('New name:', chat.name);
  if (newName && newName.trim()) {
    chat.name = newName.trim();
    if (ctxSource === 'chats') saveChats();
    else saveArchived();
    renderChatsList();
    updateHeaderMenuContent();
  }
  closeAllMenus();
}

function togglePin() {
  const chat = chats.find(c => c.id === ctxTargetId);
  if (!chat) return;
  chat.pinned = !chat.pinned;
  sortChats();
  saveChats();
  renderChatsList();
  closeAllMenus();
}

function archiveChat() {
  const chat = chats.find(c => c.id === ctxTargetId);
  if (!chat) return;
  chats = chats.filter(c => c.id !== chat.id);
  chat.pinned = false;
  archived.unshift(chat);
  currentChatId = null;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcomeScreen').classList.remove('hidden');
  saveChats();
  saveArchived();
  updateHeaderBtns();
  renderChatsList();
  closeAllMenus();
}

function deleteChat() {
  if (!confirm('Are you sure? This cannot be undone.')) return;
  if (ctxSource === 'chats') {
    chats = chats.filter(c => c.id !== ctxTargetId);
    saveChats();
  } else {
    archived = archived.filter(c => c.id !== ctxTargetId);
    saveArchived();
  }
  if (currentChatId === ctxTargetId) {
    currentChatId = null;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('welcomeScreen').classList.remove('hidden');
    updateHeaderBtns();
  }
  renderChatsList();
  closeAllMenus();
}

// ═══════════════════════════════════════════
// ARCHIVE PANEL
// ═══════════════════════════════════════════
function openArchivePanel() {
  renderArchiveList();
  document.getElementById('archivePanel').classList.add('open');
  showOverlay();
}

function closeArchivePanel() {
  document.getElementById('archivePanel').classList.remove('open');
  if (document.getElementById('sidebar').classList.contains('open')) {
    showOverlay();
  } else {
    hideOverlay();
  }
}

function renderArchiveList() {
  const list = document.getElementById('archiveList');
  list.innerHTML = '';

  if (!archived.length) {
    list.innerHTML = `<li style="padding:24px 14px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7;">No archived chats yet.</li>`;
    return;
  }

  archived.forEach(c => {
    const li = document.createElement('li');
    li.className = 'archive-item';
    li.innerHTML = `
      <div class="archive-info" onclick="unarchiveChat('${c.id}')">
        <div class="archive-name">${esc(c.name)}</div>
        <div class="archive-date">${formatDate(c.updatedAt)}</div>
      </div>
      <button class="unarchive-btn" onclick="unarchiveChat('${c.id}')">
        <i class="fi fi-rr-arrow-left"></i>
      </button>`;
    list.appendChild(li);
  });
}

function unarchiveChat(id) {
  const chat = archived.find(c => c.id === id);
  if (!chat) return;
  archived = archived.filter(c => c.id !== id);
  chats.unshift(chat);
  currentChatId = id;
  saveChats();
  saveArchived();
  openChat(id);
  renderArchiveList();
  renderChatsList();
}

// ═══════════════════════════════════════════
// HEADER
// ═══════════════════════════════════════════
function updateHeaderBtns() {
  const hasChat = currentChatId !== null;
  const newBtn = document.getElementById('headerNewChatBtn');
  const menuBtn = document.getElementById('headerMenuBtn');
  const incognitoBtn = document.getElementById('incognitoBtn');

  if (hasChat || incognitoMode) {
    newBtn.classList.add('visible');
    menuBtn.classList.add('visible');
    incognitoBtn.classList.add('visible');
  } else {
    newBtn.classList.remove('visible');
    menuBtn.classList.remove('visible');
    incognitoBtn.classList.add('visible');
  }
}

function toggleHeaderMenu() {
  const menu = document.getElementById('headerCtxMenu');
  const chat = getCurrentChat();
  if (!chat && !incognitoMode) return;

  const items = incognitoMode
    ? '<button class="ctx-item" onclick="toggleIncognito()"><i class="fi fi-rr-eye-crossed"></i> Exit Incognito</button>'
    : `
        <button class="ctx-item" onclick="renameHeaderChat()">
          <i class="fi fi-rr-edit"></i> Rename
        </button>
        <button class="ctx-item" onclick="togglePinHeaderChat()">
          <i class="fi fi-rr-bookmark"></i> ${chat?.pinned ? 'Unpin' : 'Pin'}
        </button>
        <button class="ctx-item" onclick="archiveHeaderChat()">
          <i class="fi fi-rr-box"></i> Archive
        </button>
        <button class="ctx-item danger" onclick="deleteHeaderChat()">
          <i class="fi fi-rr-trash"></i> Delete
        </button>
      `;

  menu.innerHTML = items;
  menu.classList.toggle('show');
}

function updateHeaderMenuContent() {
  document.getElementById('headerCtxMenu').classList.remove('show');
}

function renameHeaderChat() {
  const chat = getCurrentChat();
  if (!chat) return;
  const newName = prompt('New name:', chat.name);
  if (newName && newName.trim()) {
    chat.name = newName.trim();
    saveChats();
    renderChatsList();
  }
  closeAllMenus();
}

function togglePinHeaderChat() {
  const chat = getCurrentChat();
  if (!chat) return;
  chat.pinned = !chat.pinned;
  sortChats();
  saveChats();
  renderChatsList();
  closeAllMenus();
}

function archiveHeaderChat() {
  const chat = getCurrentChat();
  if (!chat) return;
  chats = chats.filter(c => c.id !== chat.id);
  chat.pinned = false;
  archived.unshift(chat);
  currentChatId = null;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcomeScreen').classList.remove('hidden');
  saveChats();
  saveArchived();
  updateHeaderBtns();
  renderChatsList();
  closeAllMenus();
}

function deleteHeaderChat() {
  if (!confirm('Are you sure? This cannot be undone.')) return;
  chats = chats.filter(c => c.id !== currentChatId);
  currentChatId = null;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('welcomeScreen').classList.remove('hidden');
  saveChats();
  updateHeaderBtns();
  renderChatsList();
  closeAllMenus();
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function closeAllMenus() {
  document.getElementById('ctxMenu').classList.remove('show');
  document.getElementById('headerCtxMenu').classList.remove('show');
  document.getElementById('plusMenu').classList.remove('show');
  document.getElementById('modelSelector').classList.remove('show');
  if (!document.getElementById('archivePanel').classList.contains('open') &&
      !document.getElementById('sidebar').classList.contains('open')) {
    hideOverlay();
  }
}

// Page refresh cleanup
window.addEventListener('beforeunload', () => {
  if (incognitoMode) {
    incognitoMode = false;
    incognitoMessages = [];
  }
});

// Initialize
updateHeaderBtns();
selectModel(selectedModel);
</script>
