<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeni</title>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css'>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ── THEME TOKENS ── */
    :root {
      --accent:#EF7722; --accent-dim:rgba(239,119,34,0.12); --accent-glow:rgba(239,119,34,0.25);
      --danger:#e05555; --header-h:54px; --sidebar-w:285px;
    }
    [data-theme="dark"] {
      --bg:#141414; --surface:#1e1e1e; --surface2:#272727; --surface3:#323232;
      --border:rgba(255,255,255,0.08); --text:#f0f0f0; --text-muted:#888; --text-dim:#505050;
      --user-bubble:rgba(239,119,34,0.15); --user-border:rgba(239,119,34,0.2); --ai-bubble:#222;
      --disclaimer-color:#444;
    }
    [data-theme="light"] {
      --bg:#f5f5f5; --surface:#ffffff; --surface2:#f0f0f0; --surface3:#e5e5e5;
      --border:rgba(0,0,0,0.08); --text:#1a1a1a; --text-muted:#666; --text-dim:#aaa;
      --user-bubble:rgba(239,119,34,0.12); --user-border:rgba(239,119,34,0.25); --ai-bubble:#ffffff;
      --disclaimer-color:#bbb;
    }

    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    #app{display:flex;flex-direction:column;height:100dvh;width:100%;overflow:hidden;position:fixed;inset:0}

    /* ── HEADER ── */
    header{height:var(--header-h);min-height:var(--header-h);width:100%;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:100;flex-shrink:0}
    .header-side{display:flex;align-items:center;gap:4px;min-width:80px}
    .header-right{justify-content:flex-end}
    .logo{font-family:'Sora',sans-serif;font-size:24px;font-weight:700;background:linear-gradient(135deg,#f4a96a,#EF7722);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;user-select:none}
    .icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s,color .15s,opacity .2s;flex-shrink:0}
    .icon-btn:active{background:var(--surface3)}
    .icon-btn.active{background:var(--accent-dim);color:var(--accent)}
    .header-grp-b{display:none}.header-grp-b.visible{display:flex}
    .header-grp-a{display:flex}.header-grp-a.hidden-btn{display:none}
    #headerIncognitoBtn.incognito-on{color:var(--accent);background:var(--accent-dim)}

    /* ── OVERLAY ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.show{opacity:1;pointer-events:all}

    /* ── SIDEBAR ── */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);max-width:90vw;background:var(--surface);border-right:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .27s cubic-bezier(.4,0,.2,1)}
    .sidebar.open{transform:translateX(0)}
    .sidebar-top{height:var(--header-h);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
    .sidebar-top-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
    .sidebar-actions{padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
    .sidebar-action-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:background .15s;text-align:left;width:100%;text-decoration:none}
    .sidebar-action-btn:active{background:var(--surface3)}
    .sidebar-action-btn i{font-size:16px;flex-shrink:0;color:var(--text-muted)}
    .sidebar-action-btn.primary{color:var(--accent);font-weight:500}
    .sidebar-action-btn.primary i{color:var(--accent)}
    .sidebar-action-btn.primary:active{background:var(--accent-dim)}

    .theme{display:flex;align-items:center;gap:11px;padding:5px 12px;border:none;background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:background .15s;text-align:left;width:100%;text-decoration:none}
    .theme-switcher{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:30px;padding:2px;gap:2px;flex-shrink:0}
    .theme-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .15s,color .15s;flex-shrink:0}
    .theme-btn.active{background:var(--surface);color:var(--text);border:1px solid var(--border);}
    [data-theme="light"] .theme-btn.active{background:#fff;border:1px solid var(--border);}

    .sidebar-divider{height:1px;background:var(--border);margin:6px 14px;flex-shrink:0}
    .search-wrap{padding:8px 10px 4px;flex-shrink:0}
    .search-inner{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
    .search-inner i{font-size:14px;color:var(--text-dim);flex-shrink:0}
    #chatSearch{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px}
    #chatSearch::placeholder{color:var(--text-dim)}
    .chats-list{flex:1;overflow-y:auto;padding:4px 10px 10px;list-style:none;-webkit-overflow-scrolling:touch}
    .chats-list::-webkit-scrollbar{display:none}
    .chat-item{display:flex;align-items:center;padding:10px 10px 10px 12px;border-radius:10px;cursor:pointer;gap:4px;transition:background .12s}
    .chat-item:active{background:var(--surface2)}.chat-item.active{background:var(--accent-dim)}
    .chat-info{flex:1;min-width:0;display:flex;align-items:center;gap:5px}
    .chat-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);flex:1;min-width:0}
    .chat-item.active .chat-name{color:var(--accent)}
    .pin-icon{font-size:11px;color:var(--text-dim);flex-shrink:0;display:none}
    .chat-item.pinned-item .pin-icon{display:inline-flex}
    .chat-date{font-size:11px;color:var(--text-dim);margin-top:2px}
    .chat-menu-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .12s,color .12s}
    .chat-menu-btn:active{background:var(--surface3);color:var(--text)}

    /* ── CONTEXT MENUS ── */
    .ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:170px;max-width:170px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.18);opacity:0;transform:scale(.93);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top left}
    [data-theme="dark"] .ctx-menu{background:var(--surface2);box-shadow:0 10px 36px rgba(0,0,0,.5)}
    .ctx-menu.show{opacity:1;transform:scale(1);pointer-events:all}
    .ctx-label{padding:8px 12px 6px;font-size:11.5px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ctx-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text);border:none;background:transparent;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:background .12s;text-decoration:none}
    .ctx-item:active{background:var(--surface3)}
    .ctx-item.danger{color:var(--danger)}.ctx-item.danger:active{background:rgba(224,85,85,.1)}
    .ctx-item i{font-size:15px;width:18px;flex-shrink:0}
    .header-ctx-menu{position:fixed;top:calc(var(--header-h) + 5px);right:10px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:195px;max-width:195px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.18);opacity:0;transform:scale(.93) translateY(-4px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top right}
    [data-theme="dark"] .header-ctx-menu{background:var(--surface2);box-shadow:0 10px 36px rgba(0,0,0,.5)}
    .header-ctx-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
    .ctx-divider{height:1px;background:var(--border);margin:4px 8px}

    /* Agent menu */
    .agent-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:230px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.18);opacity:0;transform:scale(.93) translateY(6px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:bottom left}
    [data-theme="dark"] .agent-menu{background:var(--surface2);box-shadow:0 10px 36px rgba(0,0,0,.5)}
    .agent-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
    .agent-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
    .agent-item:active{background:var(--surface3)}.agent-item.selected{background:var(--accent-dim)}
    .agent-item-icon{font-size:16px;color:var(--text-dim);flex-shrink:0;width:20px}
    .agent-item.selected .agent-item-icon{color:var(--accent)}
    .agent-left{flex:1;min-width:0}
    .agent-name{font-size:14px;font-weight:600;color:var(--text)}
    .agent-item.selected .agent-name{color:var(--accent)}
    .agent-desc{font-size:11.5px;color:var(--text-muted);margin-top:2px}
    .agent-tick{font-size:15px;color:var(--accent);opacity:0}
    .agent-item.selected .agent-tick{opacity:1}
    .agent-divider{height:1px;background:var(--border);margin:4px 8px}
    .agent-label-head{padding:8px 14px 4px;font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px}

    /* Plus menu */
    .plus-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:175px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.18);opacity:0;transform:scale(.93) translateY(6px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:bottom left}
    [data-theme="dark"] .plus-menu{background:var(--surface2);box-shadow:0 10px 36px rgba(0,0,0,.5)}
    .plus-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}

    /* Archive panel */
    .archive-panel{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);max-width:90vw;background:var(--surface);border-right:1px solid var(--border);z-index:350;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .27s cubic-bezier(.4,0,.2,1)}
    .archive-panel.open{transform:translateX(0)}
    .archive-top{height:var(--header-h);padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
    .archive-top span{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
    .archive-list{flex:1;overflow-y:auto;padding:8px 10px;list-style:none}
    .archive-list::-webkit-scrollbar{display:none}
    .archive-item{display:flex;align-items:center;padding:10px 10px 10px 12px;border-radius:10px;gap:4px}
    .archive-item:active{background:var(--surface2)}
    .archive-info{flex:1;min-width:0;cursor:pointer}
    .archive-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .archive-date{font-size:11px;color:var(--text-dim);margin-top:2px}
    .unarchive-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:background .12s,color .12s}
    .unarchive-btn:active{background:var(--surface3);color:var(--accent)}

    /* ── MAIN ── */
    main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .incognito-banner{display:none;align-items:center;gap:8px;padding:8px 16px;background:rgba(239,119,34,0.08);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-muted);flex-shrink:0}
    .incognito-banner.show{display:flex}
    .incognito-banner i{color:var(--accent);font-size:14px}
    .chat-area{flex:1;min-height:0;overflow-y:auto;padding:20px 14px 10px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
    .chat-area::-webkit-scrollbar{display:none}

    /* ── WELCOME ── */
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-bottom:30px;text-align:center}
    .welcome.hidden{display:none}
    .welcome-icon-box{width:65px;height:65px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:6px;box-shadow:0 8px 28px var(--accent-glow)}
    .welcome h2{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:var(--text)}
    .welcome p{font-size:14px;color:var(--text-muted);max-width:260px;line-height:1.65}
    .incognito-welcome .welcome-icon-box{background:var(--surface2);box-shadow:none}

    /* ── MESSAGES ── */
    .messages{display:flex;flex-direction:column;gap:16px}
    .msg{display:flex;flex-direction:column;max-width:92%;animation:msgIn .2s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;align-items:flex-end}.msg.ai{align-self:flex-start;align-items:flex-start}
    .ai-msg-header{font-size:11px;color:var(--text-dim);margin-bottom:4px;padding-left:2px;display:flex;align-items:center;gap:4px}
    .ai-msg-header span{color:var(--accent);font-weight:600}
    .msg-bubble{padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.7;word-break:break-word;overflow:hidden}
    .msg.user .msg-bubble{background:var(--user-bubble);color:var(--text);border:1px solid var(--user-border);border-bottom-right-radius:4px;cursor:pointer}
    .msg.ai .msg-bubble{background:var(--ai-bubble);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
    [data-theme="light"] .msg.ai .msg-bubble{box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .msg-bubble img.chat-img{max-width:200px;border-radius:10px;margin-bottom:6px;display:block}
    .file-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;max-width:220px}
    .file-chip i{font-size:18px;color:var(--accent);flex-shrink:0}
    .file-chip-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .file-chip-type{font-size:11px;color:var(--text-dim);margin-top:1px}
    .user-msg-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px;overflow:hidden;max-height:0;opacity:0;margin-top:0;transform:translateY(-4px);transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .25s ease,margin-top .25s ease,transform .28s cubic-bezier(.4,0,.2,1)}
    .msg.user.show-meta .user-msg-meta{max-height:36px;opacity:1;margin-top:6px;transform:translateY(0)}
    .user-msg-time{font-size:11px;color:var(--text-dim)}
    .copy-btn-small{display:flex;align-items:center;font-size:14px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .12s,color .12s}
    .copy-btn-small:active{background:var(--surface3);color:var(--text)}
    .ai-msg-footer{display:flex;align-items:center;gap:8px;margin-top:6px;padding:0 2px}
    .ai-copy-btn{display:flex;align-items:center;font-size:13px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:4px 6px;border-radius:7px;transition:background .12s,color .12s}
    .ai-copy-btn:active{background:var(--surface3);color:var(--text)}
    .ai-msg-time{font-size:11px;color:var(--text-dim)}

    .code-block{background:#0d0d0d;border:1px solid rgba(255,255,255,.08);border-radius:10px;margin:8px 0;overflow:hidden;max-width:100%}
    [data-theme="light"] .code-block{background:#1e1e1e}
    .code-block-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.08);background:#111}
    [data-theme="light"] .code-block-header{background:#161616}
    .code-lang{display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa}
    .code-lang i{font-size:13px;color:var(--accent)}
    .code-copy-btn{font-size:12px;color:#888;background:transparent;border:none;cursor:pointer;padding:3px 8px;border-radius:6px;font-family:'DM Sans',sans-serif;transition:background .12s,color .12s;display:flex;align-items:center;gap:4px}
    .code-copy-btn:active{background:rgba(255,255,255,.1);color:#fff}
    pre{margin:0;padding:12px;overflow-x:auto;font-size:13px;line-height:1.6;max-width:100%}
    pre code{font-family:'Courier New',monospace;color:#e8e8e8;white-space:pre;display:block}

    .typing-indicator{display:flex;align-items:center;gap:5px;padding:3px 0}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:tDot 1.2s ease-in-out infinite}
    .typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes tDot{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}}

    /* ── INPUT AREA ── */
    .input-wrap{flex-shrink:0;padding:6px 10px 0;background:var(--bg)}
    .attach-previews{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
    .preview-chip{position:relative;display:inline-flex}
    .preview-chip img{max-height:70px;border-radius:9px;border:1px solid var(--border)}
    .preview-chip .file-preview-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:12.5px;max-width:180px}
    .preview-chip .file-preview-chip i{font-size:16px;color:var(--accent);flex-shrink:0}
    .preview-chip .file-preview-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
    .preview-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);border:none;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .input-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:12px 12px 8px 14px;transition:border-color .2s;display:flex;flex-direction:column;gap:10px;width:100%}
    .input-box:focus-within{border-color:rgba(239,119,34,.5)}
    .input-textarea-row{display:flex;align-items:flex-start;width:100%}
    #msg-input{flex:1;width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;resize:none;max-height:140px;min-height:44px;line-height:1.6;padding:0}
    #msg-input::placeholder{color:var(--text-dim)}
    .input-action-row{display:flex;align-items:center;justify-content:space-between;width:100%}
    .input-left-btns{display:flex;align-items:center;gap:6px}
    .plus-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background .15s,color .15s}
    .plus-btn:active{background:var(--surface3);color:var(--accent)}
    .agent-toggle-btn{height:30px;padding:0 10px 0 9px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;flex-shrink:0;transition:background .15s,color .15s;white-space:nowrap}
    .agent-toggle-btn:active{background:var(--surface3)}
    .agent-toggle-btn .agent-pill-icon{font-size:12px}
    .agent-toggle-btn .agent-pill-name{font-size:12px;max-width:65px;overflow:hidden;text-overflow:ellipsis}
    .agent-toggle-btn .agent-pill-arrow{font-size:10px;opacity:.5}
    .send-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;opacity:.3;pointer-events:none;transition:opacity .18s,transform .12s}
    .send-btn.enabled{opacity:1;pointer-events:all}.send-btn.enabled:active{transform:scale(.93)}
    .send-btn.locked{opacity:.3!important;pointer-events:none!important}

    .disclaimer{padding:5px 14px 10px;text-align:center;font-size:11.5px;color:var(--disclaimer-color)}
    .disclaimer a{color:var(--accent);text-decoration:none}
    #camera-input,#image-input,#file-input{display:none}
    .typewriter-cursor::after{content:'▋';animation:blink .7s step-end infinite;font-size:13px;color:var(--accent);margin-left:1px}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  </style>
</head>
<body>
<div id="app">
  <div class="overlay" id="overlay" onclick="handleOverlayClick()"></div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-top-title">Menu</span>
      <button class="icon-btn" onclick="closeSidebar()"><i class="fi fi-rr-cross-small"></i></button>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-action-btn primary" onclick="newChat()">
        <i class="fi fi-rr-comment-medical"></i> New Chat
      </button>
      <button class="sidebar-action-btn" onclick="openArchivePanel()">
        <i class="fi fi-rr-box"></i> Archived Chats
      </button>
      <a class="sidebar-action-btn" href="about.html">
        <i class="fi fi-rr-info"></i> About
      </a>
      <div class="theme">
        <i class="fi fi-rr-palette"></i>
        <span style="flex:1;font-size:14px;">Theme</span>
        <div class="theme-switcher">
          <button class="theme-btn" id="themeDevice" onclick="setTheme('device')" title="System">
            <i class="fi fi-rr-mobile-notch"></i>
          </button>
          <button class="theme-btn" id="themeLight" onclick="setTheme('light')" title="Light">
            <i class="fi fi-rr-brightness"></i>
          </button>
          <button class="theme-btn active" id="themeDark" onclick="setTheme('dark')" title="Dark">
            <i class="fi fi-rc-moon-stars"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="search-wrap">
      <div class="search-inner">
        <i class="fi fi-rr-search"></i>
        <input type="text" id="chatSearch" placeholder="Search chats…" oninput="filterChats(this.value)" autocomplete="off">
      </div>
    </div>
    <ul class="chats-list" id="chatsList"></ul>
  </div>

  <!-- ARCHIVE PANEL -->
  <div class="archive-panel" id="archivePanel">
    <div class="archive-top">
      <button class="icon-btn" onclick="closeArchivePanelOnly()"><i class="fi fi-rr-arrow-left"></i></button>
      <span>Archived Chats</span>
    </div>
    <ul class="archive-list" id="archiveList"></ul>
  </div>

  <div class="ctx-menu" id="ctxMenu"></div>
  <div class="header-ctx-menu" id="headerCtxMenu"></div>

  <!-- AGENT MENU -->
  <div class="agent-menu" id="agentMenu">
    <div class="agent-label-head">Choose Agent</div>
    <button class="agent-item selected" id="agentItem1" onclick="selectAgent(1)">
      <i class="fi fi-sr-bulb agent-item-icon"></i>
      <div class="agent-left">
        <div class="agent-name">Agent 1</div>
        <div class="agent-desc">Gemini 2.5 Flash lite — Fast & General</div>
      </div>
      <i class="fi fi-rr-check agent-tick"></i>
    </button>
    <div class="agent-divider"></div>
    <button class="agent-item" id="agentItem2" onclick="selectAgent(2)">
      <i class="fi fi-sr-bolt agent-item-icon"></i>
      <div class="agent-left">
        <div class="agent-name">Agent 2</div>
        <div class="agent-desc">Gemini 2.5 Flash — Coding & Heavy Tasks</div>
      </div>
      <i class="fi fi-rr-check agent-tick"></i>
    </button>
  </div>

  <!-- PLUS MENU -->
  <div class="plus-menu" id="plusMenu">
    <button class="ctx-item" onclick="triggerCamera()"><i class="fi fi-rr-camera"></i> Camera</button>
    <button class="ctx-item" onclick="triggerImage()"><i class="fi fi-rr-picture"></i> Image</button>
    <button class="ctx-item" onclick="triggerFile()"><i class="fi fi-rr-document"></i> File / PDF</button>
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-side">
      <button class="icon-btn" id="chatsBtn" onclick="toggleSidebar()">
        <i class="fi fi-rr-bars-staggered"></i>
      </button>
    </div>
    <div class="logo">Zeni</div>
    <div class="header-side header-right">
      <button class="icon-btn header-grp-b" id="headerNewChatBtn" onclick="newChat()">
        <i class="fi fi-rr-comment-medical"></i>
      </button>
      <button class="icon-btn header-grp-b" id="headerMenuBtn" onclick="toggleHeaderMenu()">
        <i class="fi fi-rr-menu-dots-vertical"></i>
      </button>
      <button class="icon-btn header-grp-a" id="headerIncognitoBtn" onclick="toggleIncognito()" title="Incognito">
        <i class="fi fi-rr-incognito"></i>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <div class="incognito-banner" id="incognitoBanner">
      <i class="fi fi-rr-incognito"></i>
      <span>Incognito mode — chats won't be saved</span>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcomeScreen">
        <div class="welcome-icon-box">
          <i class="fi fi-rr-sparkles" id="welcomeIcon" style="color:#fff;"></i>
        </div>
        <h2 id="welcomeTitle">Hey, I'm Zeni</h2>
        <p id="welcomeSubtitle">Your AI assistant, ready to help with anything you need.</p>
      </div>
      <div class="messages" id="messages"></div>
    </div>
    <div class="input-wrap">
      <div class="attach-previews" id="attachPreviews"></div>
      <div class="input-box">
        <div class="input-textarea-row">
          <textarea id="msg-input" placeholder="Chat with Zeni…" rows="1" oninput="onInput()" onkeydown="onKeyDown(event)"></textarea>
        </div>
        <div class="input-action-row">
          <div class="input-left-btns">
            <button class="plus-btn" id="plusBtn" onclick="togglePlusMenu(event)">
              <i class="fi fi-sr-plus"></i>
            </button>
            <button class="agent-toggle-btn" id="agentToggleBtn" onclick="toggleAgentMenu(event)">
              <i class="fi fi-sr-bulb agent-pill-icon" id="agentPillIcon"></i>
              <span class="agent-pill-name" id="agentPillName">Agent 1</span>
              <i class="fi fi-br-angle-up agent-pill-arrow"></i>
            </button>
          </div>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <i class="fi fi-sr-arrow-small-up"></i>
          </button>
        </div>
      </div>
      <div class="disclaimer">
        Zeni isn't human and can mistakes – please double check the answers. <a href="about.html">Learn more</a>
      </div>
    </div>
    <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleFileAttach(event,'image')">
    <input type="file" id="image-input" accept="image/*" onchange="handleFileAttach(event,'image')">
    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.txt,.csv,.json,.md" onchange="handleFileAttach(event,'file')">
  </main>
</div>

<script>
const AGENT1_MODEL = "gemini-2.5-flash-lite";
const AGENT2_MODEL = "gemini-2.5-flash";
const AGENT1_LABEL = "Agent 1";
const AGENT2_LABEL = "Agent 2";

let chats             = JSON.parse(localStorage.getItem('zeni_chats')    || '[]');
let archived          = JSON.parse(localStorage.getItem('zeni_archived') || '[]');
let currentChatId     = null;
let pendingChatId     = null;
let ctxTargetId       = null;
let ctxSource         = 'chats';
let attachments       = [];
let aiThinking        = false;
let activeAgent       = 1;
let incognitoMode     = false;
let incognitoMessages = [];
let viewingArchivedId = null;

const saveChats    = () => localStorage.setItem('zeni_chats',    JSON.stringify(chats));
const saveArchived = () => localStorage.setItem('zeni_archived', JSON.stringify(archived));
const getCurrentChat = () => chats.find(c => c.id === currentChatId) || null;
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function formatDate(ts){
  const d=Date.now()-ts,MIN=60000,HR=3600000,DAY=86400000;
  if(d<MIN) return 'Just now'; if(d<HR) return `${Math.floor(d/MIN)} min ago`;
  if(d<4*HR) return `${Math.floor(d/HR)}h ago`; if(d<DAY) return 'Today';
  if(d<2*DAY) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

function applyTheme(theme){
  const html=document.documentElement;
  if(theme==='device'){
    html.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  } else { html.setAttribute('data-theme', theme); }
}
function setTheme(theme){
  localStorage.setItem('zeni_theme', theme); applyTheme(theme);
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('theme'+theme.charAt(0).toUpperCase()+theme.slice(1)).classList.add('active');
}
function initTheme(){
  const saved=localStorage.getItem('zeni_theme')||'dark'; applyTheme(saved);
  const id='theme'+saved.charAt(0).toUpperCase()+saved.slice(1);
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id); if(el) el.classList.add('active');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
    if(localStorage.getItem('zeni_theme')==='device') applyTheme('device');
  });
}

function renderContent(text){
  let html='';
  const parts=text.split(/(```[\s\S]*?```)/g);
  parts.forEach(part=>{
    if(part.startsWith('```')){
      const lines=part.slice(3,-3).split('\n');
      const lang=lines[0].trim()||'code';
      const code=lines.slice(1).join('\n');
      html+=`<div class="code-block"><div class="code-block-header"><span class="code-lang"><i class="${langIcon(lang)}"></i>${esc(lang)}</span><button class="code-copy-btn" onclick="copyCode(this)"><i class="fi fi-rr-copy"></i></button></div><pre><code>${esc(code)}</code></pre></div>`;
    } else {
      let t=esc(part).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code style="background:var(--surface3);padding:1px 5px;border-radius:4px;font-size:13px">$1</code>').replace(/\n/g,'<br>');
      html+=t;
    }
  });
  return html;
}
function langIcon(lang){
  const l=lang.toLowerCase();
  if(l==='python'||l==='py') return 'fi fi-rr-snake';
  if(l==='html') return 'fi fi-rr-browser';
  if(l==='css') return 'fi fi-rr-palette';
  if(['js','javascript','ts','typescript'].includes(l)) return 'fi fi-rr-code-simple';
  if(l==='json') return 'fi fi-rr-curly-brackets';
  if(['bash','sh','shell'].includes(l)) return 'fi fi-rr-terminal';
  return 'fi fi-rr-code-branch';
}
function copyCode(btn){
  const code=btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>'; setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}

const showOverlay=()=>document.getElementById('overlay').classList.add('show');
const hideOverlay=()=>document.getElementById('overlay').classList.remove('show');
function handleOverlayClick(){
  if(document.getElementById('archivePanel').classList.contains('open')){ closeArchivePanelOnly(); return; }
  closeSidebar(); closeAllMenus();
}
function toggleSidebar(){ document.getElementById('sidebar').classList.contains('open')?closeSidebar():openSidebar(); }
function openSidebar(){
  renderChatsList(); document.getElementById('chatSearch').value='';
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('chatsBtn').classList.add('active'); showOverlay();
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('chatsBtn').classList.remove('active');
  if(!document.getElementById('archivePanel').classList.contains('open')) hideOverlay();
}
function closeArchivePanelOnly(){
  document.getElementById('archivePanel').classList.remove('open');
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('chatsBtn').classList.add('active'); showOverlay();
}

function renderChatsList(filter=''){
  const list=document.getElementById('chatsList'); list.innerHTML='';
  const q=filter.toLowerCase();
  const sorted=[...chats].sort((a,b)=>{
    if(a.pinned&&!b.pinned) return -1; if(!a.pinned&&b.pinned) return 1;
    return b.updatedAt-a.updatedAt;
  });
  const filtered=q?sorted.filter(c=>c.name.toLowerCase().includes(q)):sorted;
  if(!filtered.length){
    list.innerHTML=`<li style="padding:20px 14px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7;">${q?'No chats found.':'No chats yet.<br>Start a new one!'}</li>`; return;
  }
  filtered.forEach(c=>{
    const li=document.createElement('li');
    li.className='chat-item'+(c.id===currentChatId?' active':'')+(c.pinned?' pinned-item':'');
    li.innerHTML=`
      <div class="chat-info" onclick="openChat('${c.id}')">
        <div style="flex:1;min-width:0">
          <div class="chat-name">${esc(c.name)}</div>
          <div class="chat-date">${formatDate(c.updatedAt)}</div>
        </div>
        <i class="fi fi-br-thumbtack pin-icon"></i>
      </div>
      <button class="chat-menu-btn" onclick="openCtxMenu(event,'${c.id}','chats')">
        <i class="fi fi-rr-menu-dots-vertical"></i>
      </button>`;
    list.appendChild(li);
  });
}
function filterChats(val){ renderChatsList(val); }

function newChat(){
  if(incognitoMode){ clearIncognito(); return; }
  viewingArchivedId=null;
  pendingChatId=genId(); currentChatId=null;
  document.getElementById('messages').innerHTML='';
  showWelcome(false); updateHeaderBtns(); renderChatsList(); closeSidebar(); closeAllMenus();
  setTimeout(()=>document.getElementById('msg-input').focus(),300);
}
function openChat(id){
  if(incognitoMode) return;
  viewingArchivedId=null;
  pendingChatId=null; currentChatId=id;
  renderMessages(); renderChatsList(); updateHeaderBtns(); updateHeaderMenuContent(); closeSidebar();
}

function showWelcome(incognito){
  const ws=document.getElementById('welcomeScreen');
  const icon=document.getElementById('welcomeIcon');
  const title=document.getElementById('welcomeTitle');
  const sub=document.getElementById('welcomeSubtitle');
  ws.classList.remove('hidden','incognito-welcome');
  if(incognito){
    ws.classList.add('incognito-welcome');
    icon.className='fi fi-rr-incognito'; icon.style.color='var(--text-muted)';
    title.textContent="Incognito Chat"; sub.textContent="This chat won't be saved. Close incognito to end.";
  } else {
    icon.className='fi fi-rr-sparkles'; icon.style.color='#fff';
    title.textContent="Hey, I'm Zeni"; sub.textContent="Your AI assistant, ready to help with anything you need.";
  }
}

function renderMessages(){
  const chat=getCurrentChat();
  const msgEl=document.getElementById('messages'); msgEl.innerHTML='';
  if(!chat||!chat.messages||!chat.messages.length){ showWelcome(false); return; }
  document.getElementById('welcomeScreen').classList.add('hidden');
  chat.messages.forEach(m=>buildMsgEl(m)); scrollBottom();
}

function buildMsgEl(m, typewriterText){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  const wrap=document.createElement('div'); wrap.className=`msg ${m.role}`;
  if(m.role==='user'){
    let content='';
    if(m.image) content+=`<img class="chat-img" src="${m.image}" alt="">`;
    if(m.fileChip) content+=`<div class="file-chip"><i class="fi fi-rr-document"></i><div><div class="file-chip-name">${esc(m.fileChip.name)}</div><div class="file-chip-type">${esc(m.fileChip.type)}</div></div></div>`;
    if(m.content) content+=renderContent(m.content);
    wrap.innerHTML=`<div class="msg-bubble" onclick="toggleUserMeta(this.parentElement)">${content}</div><div class="user-msg-meta"><span class="user-msg-time">${fmtTime(m.ts||Date.now())}</span><button class="copy-btn-small" onclick="copyMsg(event,this)"><i class="fi fi-rr-copy"></i></button></div>`;
    wrap.dataset.text=m.content||'';
  } else {
    const agentLabel=m.agent||AGENT1_LABEL;
    const elapsed=(m.elapsed!==undefined&&m.elapsed!==null)?` • ${m.elapsed}s`:'';
    const timeStr=fmtTime(m.ts||Date.now());
    const bubbleContent=typewriterText?'':renderContent(m.content||'');
    wrap.innerHTML=`<div class="ai-msg-header"><span>${esc(agentLabel)}</span><span style="color:var(--text-dim)">${elapsed}</span></div><div class="msg-bubble">${bubbleContent}</div><div class="ai-msg-footer"><button class="ai-copy-btn" onclick="copyAiMsg(event,this)"><i class="fi fi-rr-copy"></i></button><span class="ai-msg-time">${timeStr}</span></div>`;
    wrap.dataset.text=m.content||'';
    if(typewriterText){ runTypewriter(wrap.querySelector('.msg-bubble'), typewriterText); }
  }
  msgEl.appendChild(wrap);
  return wrap;
}

function runTypewriter(bubble, text){
  bubble.classList.add('typewriter-cursor'); bubble.innerHTML='';
  let i=0; const ca=document.getElementById('chatArea'); const CHUNK=3;
  function tick(){
    if(i>=text.length){ bubble.classList.remove('typewriter-cursor'); bubble.innerHTML=renderContent(text); return; }
    i=Math.min(i+CHUNK,text.length); bubble.innerHTML=renderContent(text.substring(0,i));
    if(ca.scrollHeight-ca.scrollTop-ca.clientHeight<180) ca.scrollTop=ca.scrollHeight;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function toggleUserMeta(wrap){ wrap.classList.toggle('show-meta'); }
function copyMsg(e,btn){
  e.stopPropagation();
  navigator.clipboard.writeText(btn.closest('.msg').dataset.text||'').then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>'; setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}
function copyAiMsg(e,btn){
  e.stopPropagation();
  navigator.clipboard.writeText(btn.closest('.msg').dataset.text||'').then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>'; setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}
function scrollBottom(){ const ca=document.getElementById('chatArea'); requestAnimationFrame(()=>{ ca.scrollTop=ca.scrollHeight; }); }

function exportChat(id){
  const chat=chats.find(c=>c.id===id)||archived.find(c=>c.id===id);
  if(!chat||!chat.messages?.length) return;
  const lines=[];
  lines.push(`ZENI CHAT EXPORT`); lines.push(`Chat: ${chat.name}`);
  lines.push(`Exported: ${new Date().toLocaleString('en-IN')}`); lines.push(`${'─'.repeat(50)}\n`);
  chat.messages.forEach(m=>{
    const who=m.role==='user'?'You':m.agent||'Zeni';
    lines.push(`[${who}]  ${fmtTime(m.ts||Date.now())}`);
    if(m.content) lines.push(m.content); lines.push('');
  });
  const content=lines.join('\n');
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${chat.name}</title><style>body{font-family:Arial,sans-serif;font-size:13px;line-height:1.7;padding:32px;color:#111;white-space:pre-wrap}h1{font-size:16px;margin-bottom:4px}p{color:#666;font-size:12px;margin-bottom:20px}hr{border:none;border-top:1px solid #ddd;margin:12px 0}@media print{@page{margin:20mm}}</style></head><body><h1>${esc(chat.name)}</h1><p>Exported from Zeni · ${new Date().toLocaleString('en-IN')}</p><hr>${content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</body></html>`);
  w.document.close(); w.focus(); setTimeout(()=>{ w.print(); },400); closeAllMenus();
}

// ════════════════════════════════════════════════
// SEND MESSAGE
// BUG FIX 1: viewingArchivedId — message archived chat mein hi save hoga, auto-unarchive nahi hoga
// BUG FIX 2: image attachment wala send button fix — attachments.length check sahi kiya
// ════════════════════════════════════════════════
async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  // BUG FIX 2: attachments.length > 0 explicit check
  if((!text && attachments.length===0) || aiThinking) return;
  const now=Date.now();
  const imgAtt=attachments.find(a=>a.type==='image');
  const fileAtt=attachments.find(a=>a.type==='file');

  if(incognitoMode){
    const uMsg={role:'user',content:text,image:imgAtt?`data:${imgAtt.mime};base64,${imgAtt.base64}`:null,fileChip:fileAtt?{name:fileAtt.name,type:fileAtt.mime}:null,fileData:fileAtt||null,ts:now};
    incognitoMessages.push(uMsg);
    input.value=''; input.style.height='auto'; clearAttachments(); toggleSend();
    buildMsgEl(uMsg); scrollBottom();
    await doAIReply(incognitoMessages,null,true); return;
  }

  // BUG FIX 1: If viewing archived chat — save message IN archived chat, do NOT unarchive
  if(viewingArchivedId){
    const archivedChat=archived.find(c=>c.id===viewingArchivedId);
    if(archivedChat){
      const uMsg={role:'user',content:text,image:imgAtt?`data:${imgAtt.mime};base64,${imgAtt.base64}`:null,fileChip:fileAtt?{name:fileAtt.name,type:fileAtt.mime}:null,fileData:fileAtt||null,ts:now};
      archivedChat.messages.push(uMsg); archivedChat.updatedAt=now; saveArchived();
      input.value=''; input.style.height='auto'; clearAttachments(); toggleSend();
      buildMsgEl(uMsg); scrollBottom();
      // AI reply also saved in archived chat
      await doAIReplyArchived(archivedChat.messages, archivedChat);
    }
    return;
  }

  if(!currentChatId){
    const id=pendingChatId||genId(); pendingChatId=null;
    chats.unshift({id,name:text.slice(0,42)||'New Chat',messages:[],createdAt:now,updatedAt:now});
    currentChatId=id; saveChats(); updateHeaderBtns(); updateHeaderMenuContent();
  }

  const chat=getCurrentChat();
  const uMsg={role:'user',content:text,image:imgAtt?`data:${imgAtt.mime};base64,${imgAtt.base64}`:null,fileChip:fileAtt?{name:fileAtt.name,type:fileAtt.mime}:null,fileData:fileAtt||null,ts:now};
  chat.messages.push(uMsg); chat.updatedAt=now; saveChats();
  input.value=''; input.style.height='auto'; clearAttachments(); toggleSend();
  buildMsgEl(uMsg); scrollBottom(); renderChatsList();
  await doAIReply(chat.messages,chat,false);
}

// AI reply for archived chat — saves in archived, does NOT move to regular chats
async function doAIReplyArchived(messages, archivedChat){
  aiThinking=true; lockSend(true);
  const startMs=Date.now();
  const agentLabel=activeAgent===1?AGENT1_LABEL:AGENT2_LABEL;
  const typing=showTyping();
  try {
    const replyText=await callAI(messages);
    const elapsed=Math.round((Date.now()-startMs)/1000);
    const aiMsg={role:'ai',content:replyText,agent:agentLabel,elapsed,ts:Date.now()};
    archivedChat.messages.push(aiMsg); archivedChat.updatedAt=Date.now(); saveArchived();
    typing.remove(); buildMsgEl(aiMsg, replyText); scrollBottom();
  } catch(err){
    const errMsg={role:'ai',content:`⚠️ ${err.message||'Something went wrong.'}`,agent:agentLabel,ts:Date.now()};
    archivedChat.messages.push(errMsg); archivedChat.updatedAt=Date.now(); saveArchived();
    typing.remove(); buildMsgEl(errMsg); scrollBottom();
  }
  aiThinking=false; lockSend(false);
}

async function doAIReply(messages,chat,isIncognito){
  aiThinking=true; lockSend(true);
  const startMs=Date.now();
  const agentLabel=activeAgent===1?AGENT1_LABEL:AGENT2_LABEL;
  const typing=showTyping();
  try {
    const replyText=await callAI(messages);
    const elapsed=Math.round((Date.now()-startMs)/1000);
    const aiMsg={role:'ai',content:replyText,agent:agentLabel,elapsed,ts:Date.now()};
    if(isIncognito){ incognitoMessages.push(aiMsg); }
    else { chat.messages.push(aiMsg); chat.updatedAt=Date.now(); saveChats(); renderChatsList(); }
    typing.remove(); buildMsgEl(aiMsg, replyText); scrollBottom();
  } catch(err){
    const errMsg={role:'ai',content:`⚠️ ${err.message||'Something went wrong. Please try again.'}`,agent:agentLabel,ts:Date.now()};
    if(!isIncognito&&chat){ chat.messages.push(errMsg); chat.updatedAt=Date.now(); saveChats(); }
    typing.remove(); buildMsgEl(errMsg); scrollBottom();
  }
  aiThinking=false; lockSend(false);
}

function showTyping(){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  const div=document.createElement('div'); div.className='msg ai';
  const agentLabel=activeAgent===1?AGENT1_LABEL:AGENT2_LABEL;
  div.innerHTML=`<div class="ai-msg-header"><span>${esc(agentLabel)}</span></div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  msgEl.appendChild(div); scrollBottom(); return div;
}

async function callAI(messages){
  // BUG FIX 2: Properly format image for Gemini API (inlineData format)
  const formatted=messages.map(m=>{
    const parts=[];
    if(m.image){
      const b64=m.image.split(',')[1];
      const mime=m.image.split(';')[0].split(':')[1];
      parts.push({type:'image_url',image_url:{url:`data:${mime};base64,${b64}`}});
    }
    if(m.fileData?.base64){ parts.push({type:'text',text:`[File attached: ${m.fileData.name} (${m.fileData.mime})]\n${m.fileData.textContent||'[Binary file]'}`}); }
    if(m.content) parts.push({type:'text',text:m.content});
    if(parts.length>1||m.image||m.fileData) return {role:m.role==='ai'?'assistant':'user',content:parts};
    return {role:m.role==='ai'?'assistant':'user',content:m.content||''};
  });
  const model=activeAgent===1?AGENT1_MODEL:AGENT2_MODEL;
  const res=await fetch('/api/chat',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:formatted,model}) });
  const data=await res.json();
  if(!res.ok||data.error) throw new Error(data.error||'API error '+res.status);
  return data.reply;
}

function lockSend(lock){ document.getElementById('sendBtn').classList.toggle('locked',lock); }

function onInput(){
  const ta=document.getElementById('msg-input');
  ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; toggleSend();
}
function onKeyDown(e){ if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>600){ e.preventDefault(); sendMessage(); } }
function toggleSend(){
  const val=document.getElementById('msg-input').value.trim();
  // BUG FIX 2: attachments.length > 0 so image attach enables send button
  document.getElementById('sendBtn').classList.toggle('enabled',!!(val||attachments.length>0));
}
function triggerCamera(){ closePlusMenu(); document.getElementById('camera-input').click(); }
function triggerImage(){  closePlusMenu(); document.getElementById('image-input').click(); }
function triggerFile(){   closePlusMenu(); document.getElementById('file-input').click(); }
function handleFileAttach(e,type){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const result=ev.target.result; const base64=result.split(',')[1];
    const att={type,base64,mime:file.type,name:file.name,textContent:null};
    if(['text/plain','application/json'].includes(file.type)||file.name.match(/\.(md|csv)$/)) att.textContent=atob(base64);
    attachments.push(att); renderAttachPreviews(); toggleSend();
  };
  reader.readAsDataURL(file); e.target.value='';
}
function renderAttachPreviews(){
  const wrap=document.getElementById('attachPreviews'); wrap.innerHTML='';
  attachments.forEach((a,i)=>{
    const chip=document.createElement('div'); chip.className='preview-chip';
    if(a.type==='image') chip.innerHTML=`<img src="data:${a.mime};base64,${a.base64}" alt=""><button class="preview-remove" onclick="removeAttachment(${i})"><i class="fi fi-rr-cross"></i></button>`;
    else chip.innerHTML=`<div class="file-preview-chip"><i class="fi fi-rr-document"></i><span class="file-preview-name">${esc(a.name)}</span></div><button class="preview-remove" onclick="removeAttachment(${i})"><i class="fi fi-rr-cross"></i></button>`;
    wrap.appendChild(chip);
  });
}
function removeAttachment(i){ attachments.splice(i,1); renderAttachPreviews(); toggleSend(); }
function clearAttachments(){ attachments=[]; renderAttachPreviews(); }

function togglePlusMenu(e){
  e.stopPropagation(); const menu=document.getElementById('plusMenu');
  if(menu.classList.contains('show')){ closePlusMenu(); return; }
  closeAllMenus(menu);
  const rect=document.getElementById('plusBtn').getBoundingClientRect();
  menu.style.bottom=(window.innerHeight-rect.top+6)+'px'; menu.style.left=rect.left+'px'; menu.classList.add('show');
}
function closePlusMenu(){ document.getElementById('plusMenu').classList.remove('show'); }
function toggleAgentMenu(e){
  e.stopPropagation(); const menu=document.getElementById('agentMenu');
  if(menu.classList.contains('show')){ menu.classList.remove('show'); return; }
  closeAllMenus(menu);
  const rect=document.getElementById('agentToggleBtn').getBoundingClientRect();
  menu.style.bottom=(window.innerHeight-rect.top+6)+'px'; menu.style.left=Math.max(8,rect.right-230)+'px'; menu.classList.add('show');
}
function selectAgent(n){
  activeAgent=n;
  document.getElementById('agentItem1').classList.toggle('selected',n===1);
  document.getElementById('agentItem2').classList.toggle('selected',n===2);
  document.getElementById('agentPillName').textContent=n===1?'Agent 1':'Agent 2';
  document.getElementById('agentPillIcon').className=n===1?'fi fi-sr-bulb agent-pill-icon':'fi fi-sr-bolt agent-pill-icon';
  document.getElementById('agentMenu').classList.remove('show');
}
function toggleIncognito(){
  incognitoMode=!incognitoMode;
  const btn=document.getElementById('headerIncognitoBtn');
  const banner=document.getElementById('incognitoBanner');
  if(incognitoMode){
    btn.classList.add('incognito-on'); banner.classList.add('show');
    document.getElementById('headerNewChatBtn').classList.remove('visible');
    document.getElementById('headerMenuBtn').classList.remove('visible');
    document.getElementById('headerCtxMenu').classList.remove('show');
    incognitoMessages=[]; document.getElementById('messages').innerHTML=''; showWelcome(true);
  } else { clearIncognito(); }
}
function clearIncognito(){
  incognitoMode=false; incognitoMessages=[];
  document.getElementById('headerIncognitoBtn').classList.remove('incognito-on');
  document.getElementById('incognitoBanner').classList.remove('show');
  document.getElementById('messages').innerHTML='';
  if(currentChatId&&getCurrentChat()) renderMessages(); else showWelcome(false);
  updateHeaderBtns();
}
window.addEventListener('beforeunload',()=>{ if(incognitoMode){ incognitoMode=false; incognitoMessages=[]; } });

function openCtxMenu(e,id,source){
  e.stopPropagation(); ctxTargetId=id; ctxSource=source||'chats';
  const list=ctxSource==='archived'?archived:chats;
  const chat=list.find(c=>c.id===id); if(!chat) return;
  const menu=document.getElementById('ctxMenu'); closeAllMenus(menu);
  let html=`<div class="ctx-label">${esc(chat.name)}</div>`;
  html+=`<button class="ctx-item" onclick="ctxAction('rename')"><i class="fi fi-rr-pencil"></i> Rename</button>`;
  if(ctxSource==='chats'){
    const pinLabel=chat.pinned?'Unpin':'Pin'; const pinIcon=chat.pinned?'fi fi-rr-thumbtack-slash':'fi fi-rr-thumbtack';
    html+=`<button class="ctx-item" onclick="ctxAction('pin')"><i class="${pinIcon}"></i> ${pinLabel}</button>`;
    html+=`<button class="ctx-item" onclick="ctxAction('archive')"><i class="fi fi-rr-box"></i> Archive</button>`;
    html+=`<button class="ctx-item" onclick="exportChat('${id}')"><i class="fi fi-br-download"></i> Export PDF</button>`;
  } else {
    html+=`<button class="ctx-item" onclick="ctxAction('unarchive')"><i class="fi fi-rr-arrow-up-from-square"></i> Unarchive</button>`;
  }
  html+=`<button class="ctx-item danger" onclick="ctxAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>`;
  menu.innerHTML=html;
  const rect=e.currentTarget.getBoundingClientRect(); const mW=175,mH=220;
  let top=rect.bottom+4, left=rect.left-mW+rect.width;
  if(top+mH>window.innerHeight) top=rect.top-mH-4;
  if(left<8) left=8; if(left+mW>window.innerWidth) left=window.innerWidth-mW-8;
  menu.style.top=top+'px'; menu.style.left=left+'px'; menu.classList.add('show');
}
function ctxAction(action){
  const list=ctxSource==='archived'?archived:chats;
  const chat=list.find(c=>c.id===ctxTargetId); if(!chat){ closeAllMenus(); return; }
  if(action==='rename'){
    const name=prompt('Rename chat:',chat.name);
    if(name?.trim()){ chat.name=name.trim(); ctxSource==='archived'?saveArchived():saveChats(); renderChatsList(); renderArchiveList(); if(currentChatId===ctxTargetId) updateHeaderMenuContent(); }
  } else if(action==='pin'){ chat.pinned=!chat.pinned; saveChats(); renderChatsList();
  } else if(action==='archive'){
    const idx=chats.findIndex(c=>c.id===ctxTargetId);
    if(idx!==-1){ const[r]=chats.splice(idx,1); r.archivedAt=Date.now(); archived.unshift(r); saveChats(); saveArchived();
      if(currentChatId===ctxTargetId){ currentChatId=null; viewingArchivedId=null; document.getElementById('messages').innerHTML=''; showWelcome(false); updateHeaderBtns(); updateHeaderMenuContent(); } renderChatsList(); }
  } else if(action==='unarchive'){
    const idx=archived.findIndex(c=>c.id===ctxTargetId);
    if(idx!==-1){ const[r]=archived.splice(idx,1); delete r.archivedAt; r.updatedAt=Date.now(); chats.unshift(r); saveChats(); saveArchived(); renderArchiveList(); renderChatsList();
      // If currently viewing this archived chat, now open it as normal chat
      if(viewingArchivedId===ctxTargetId){ viewingArchivedId=null; currentChatId=r.id; renderMessages(); updateHeaderBtns(); updateHeaderMenuContent(); }
    }
  } else if(action==='delete'){
    if(!confirm(`Delete "${chat.name}"?`)){ closeAllMenus(); return; }
    if(ctxSource==='archived'){ archived=archived.filter(c=>c.id!==ctxTargetId); saveArchived(); renderArchiveList();
      if(viewingArchivedId===ctxTargetId){ viewingArchivedId=null; document.getElementById('messages').innerHTML=''; showWelcome(false); updateHeaderBtns(); }
    } else { chats=chats.filter(c=>c.id!==ctxTargetId); saveChats();
      if(currentChatId===ctxTargetId){ currentChatId=null; viewingArchivedId=null; document.getElementById('messages').innerHTML=''; showWelcome(false); updateHeaderBtns(); updateHeaderMenuContent(); } renderChatsList(); }
  }
  closeAllMenus();
}

function updateHeaderBtns(){
  if(incognitoMode) return;
  const active=!!(currentChatId&&getCurrentChat()) || !!viewingArchivedId;
  document.getElementById('headerNewChatBtn').classList.toggle('visible',active);
  document.getElementById('headerMenuBtn').classList.toggle('visible',active);
  document.querySelectorAll('.header-grp-a').forEach(el=>el.classList.toggle('hidden-btn',active));
  if(!active) document.getElementById('headerCtxMenu').classList.remove('show');
}
function updateHeaderMenuContent(){
  const menu=document.getElementById('headerCtxMenu');
  const chat=getCurrentChat(); if(!chat){ menu.innerHTML=''; return; }
  menu.innerHTML=`<div class="ctx-label">${esc(chat.name)}</div>
    <button class="ctx-item" onclick="headerAction('rename')"><i class="fi fi-rr-pencil"></i> Rename</button>
    <button class="ctx-item" onclick="headerAction('archive')"><i class="fi fi-rr-box"></i> Archive</button>
    <a class="ctx-item" href="report.html" onclick="closeAllMenus()"><i class="fi fi-rr-flag"></i> Report</a>
    <button class="ctx-item danger" onclick="headerAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" onclick="newChat()"><i class="fi fi-rr-comment-medical"></i> New Chat</button>`;
}
function toggleHeaderMenu(){
  const menu=document.getElementById('headerCtxMenu');
  // Show for both normal chat and archived view
  const hasChat=!!(currentChatId&&getCurrentChat());
  if(!hasChat&&!viewingArchivedId) return;
  if(menu.classList.contains('show')) menu.classList.remove('show');
  else { updateHeaderMenuContent(); closeAllMenus(menu); menu.classList.add('show'); }
}
function headerAction(action){ ctxTargetId=currentChatId; ctxSource='chats'; document.getElementById('headerCtxMenu').classList.remove('show'); ctxAction(action); }

function openArchivePanel(){ renderArchiveList(); document.getElementById('archivePanel').classList.add('open'); showOverlay(); closeSidebar(); }
function renderArchiveList(){
  const list=document.getElementById('archiveList'); list.innerHTML='';
  if(!archived.length){ list.innerHTML=`<li style="padding:24px 14px;text-align:center;color:var(--text-dim);font-size:13px;">No archived chats.</li>`; return; }
  archived.forEach(c=>{
    const li=document.createElement('li'); li.className='archive-item';
    li.innerHTML=`<div class="archive-info" onclick="openArchivedChat('${c.id}')"><div class="archive-name">${esc(c.name)}</div><div class="archive-date">${formatDate(c.updatedAt)}</div></div><button class="unarchive-btn" onclick="quickUnarchive('${c.id}')"><i class="fi fi-rr-arrow-up-from-square"></i></button><button class="chat-menu-btn" onclick="openCtxMenu(event,'${c.id}','archived')"><i class="fi fi-rr-menu-dots-vertical"></i></button>`;
    list.appendChild(li);
  });
}
function quickUnarchive(id){ ctxTargetId=id; ctxSource='archived'; ctxAction('unarchive'); }

function openArchivedChat(id){
  const chat=archived.find(c=>c.id===id); if(!chat) return;
  document.getElementById('archivePanel').classList.remove('open');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('chatsBtn').classList.remove('active'); hideOverlay();
  currentChatId=null;
  viewingArchivedId=id;
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('messages').innerHTML='';
  (chat.messages||[]).forEach(m=>buildMsgEl(m)); scrollBottom();
  updateHeaderBtns();
  // Header menu for archived view
  const menu=document.getElementById('headerCtxMenu');
  menu.innerHTML=`<div class="ctx-label">${esc(chat.name)}</div>
    <button class="ctx-item" onclick="quickUnarchive('${id}');closeAllMenus()"><i class="fi fi-rr-arrow-up-from-square"></i> Unarchive</button>
    <button class="ctx-item" onclick="exportChat('${id}')"><i class="fi fi-rr-file-export"></i> Export PDF</button>
    <button class="ctx-item danger" onclick="ctxTargetId='${id}';ctxSource='archived';ctxAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" onclick="newChat()"><i class="fi fi-rr-comment-medical"></i> New Chat</button>`;
}

function closeAllMenus(except){
  ['ctxMenu','headerCtxMenu','agentMenu','plusMenu'].forEach(id=>{
    const el=document.getElementById(id); if(el!==except) el.classList.remove('show');
  });
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.ctx-menu,.chat-menu-btn,.header-ctx-menu,#headerMenuBtn,.unarchive-btn,.agent-menu,#agentToggleBtn,.plus-menu,#plusBtn'))
    closeAllMenus();
});

// INIT
initTheme();
showWelcome(false);
updateHeaderBtns();
updateHeaderMenuContent();
</script>
