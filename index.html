<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zeni</title>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#141414; --surface:#1e1e1e; --surface2:#272727; --surface3:#323232;
      --border:rgba(255,255,255,0.08); --accent:#EF7722; --accent-dim:rgba(239,119,34,0.12);
      --text:#f0f0f0; --text-muted:#888; --text-dim:#505050;
      --sidebar-w:285px; --header-h:54px; --danger:#e05555;
      --user-bubble:rgba(239,119,34,0.15); --ai-bubble:#222;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    #app{display:flex;flex-direction:column;height:100dvh;width:100%;overflow:hidden;position:fixed;inset:0}

    /* ── HEADER ── */
    header{height:var(--header-h);min-height:var(--header-h);width:100%;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:100;flex-shrink:0}
    .header-side{display:flex;align-items:center;gap:4px;min-width:80px}
    .header-right{justify-content:flex-end}
    .logo{font-family:'Sora',sans-serif;font-size:24px;font-weight:700;background:linear-gradient(135deg,#f4a96a,#EF7722);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;user-select:none}
    .icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .15s,color .15s,opacity .2s;flex-shrink:0}
    .icon-btn:active{background:var(--surface3)}
    .icon-btn.active{background:var(--accent-dim);color:var(--accent)}
    #headerNewChatBtn,#headerMenuBtn{opacity:0;pointer-events:none}
    #headerNewChatBtn.visible,#headerMenuBtn.visible{opacity:1;pointer-events:all}
    /* Group A: incognito + image-gen — show when no active chat */
    .header-grp-a{opacity:1;pointer-events:all;transition:opacity .2s,background .15s,color .15s}
    .header-grp-a.hidden-btn{opacity:0;pointer-events:none}
    #headerIncognitoBtn.incognito-on{color:var(--accent);background:var(--accent-dim)}

    /* ── OVERLAY ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.show{opacity:1;pointer-events:all}

    /* ── SIDEBAR ── */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);max-width:90vw;background:var(--surface);border-right:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .27s cubic-bezier(.4,0,.2,1);will-change:transform;}
    .sidebar.open{transform:translateX(0)}
    .sidebar-top{height:var(--header-h);min-height:var(--header-h);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
    .sidebar-top-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
    .sidebar-actions{padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
    .sidebar-action-btn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:background .15s,color .15s;text-align:left;width:100%;text-decoration:none;}
    .sidebar-action-btn:active{background:var(--surface3)}
    .sidebar-action-btn i{font-size:16px;flex-shrink:0}
    .sidebar-action-btn.primary{color:var(--accent);font-weight:500}
    .sidebar-action-btn.primary:active{background:var(--accent-dim)}
    .sidebar-action-btn.primary i{color:var(--accent)}
    /* NEW badge */
    .new-badge{font-size:10px;font-weight:700;background:var(--accent);color:#fff;padding:2px 7px;border:2px solid rgba(239,119,34,0.2);border-radius:20px;margin-left:2px;letter-spacing:.3px;}
    .sidebar-divider{height:1px;background:var(--border);margin:6px 14px;flex-shrink:0}

    /* Search bar */
    .search-wrap{padding:8px 10px 4px;flex-shrink:0}
    .search-inner{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
    .search-inner i{font-size:14px;color:var(--text-dim);flex-shrink:0}
    #chatSearch{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px}
    #chatSearch::placeholder{color:var(--text-dim)}

    .chats-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;list-style:none;-webkit-overflow-scrolling:touch}
    .chats-list::-webkit-scrollbar{display:none}
    .chat-item{display:flex;align-items:center;padding:10px 10px 10px 12px;border-radius:10px;cursor:pointer;gap:4px;transition:background .12s}
    .chat-item:active{background:var(--surface2)}
    .chat-item.active{background:var(--accent-dim)}
    .chat-info{flex:1;min-width:0;min-width:0;display:flex;align-items:center;gap:5px}
    .chat-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);flex:1;min-width:0}
    .chat-item.active .chat-name{color:var(--accent)}
    .pin-icon{font-size:11px;color:var(--text-dim);flex-shrink:0;display:none}
    .chat-item.pinned-item .pin-icon{display:inline-flex}
    .chat-date{font-size:11px;color:var(--text-dim);margin-top:2px}
    .chat-menu-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;opacity:1;transition:background .12s,color .12s}
    .chat-menu-btn:active{background:var(--surface3);color:var(--text)}

    /* ── CONTEXT MENUS ── */
    .ctx-menu{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:165px;max-width:165px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.93);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top left}
    .ctx-menu.show{opacity:1;transform:scale(1);pointer-events:all}
    .ctx-label{padding:8px 12px 6px;font-size:11.5px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ctx-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--text);border:none;background:transparent;width:100%;text-align:left;font-family:'DM Sans',sans-serif;transition:background .12s;text-decoration:none}
    .ctx-item:active{background:var(--surface3)}
    .ctx-item.danger{color:var(--danger)}
    .ctx-item.danger:active{background:rgba(224,85,85,.12)}
    .ctx-item i{font-size:15px;width:18px;flex-shrink:0}
    .header-ctx-menu{position:fixed;top:calc(var(--header-h) + 5px);right:10px;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:195px;max-width:195px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.93) translateY(-4px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:top right}
    .header-ctx-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
    .ctx-divider{height:1px;background:var(--border);margin:4px 8px}

    /* Agent picker popup */
    .agent-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:6px;margin: 15px 10px;min-width:230px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.93) translateY(6px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:bottom left}
    .agent-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
    .agent-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-radius:9px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
    .agent-item:active{background:var(--surface3)}
    .agent-item.selected{background:var(--accent-dim)}
    .agent-item-icon{font-size:16px;color:var(--text-dim);flex-shrink:0;width:20px}
    .agent-item.selected .agent-item-icon{color:var(--accent)}
    .agent-left{flex:1;min-width:0}
    .agent-name{font-size:14px;font-weight:600;color:var(--text)}
    .agent-item.selected .agent-name{color:var(--accent)}
    .agent-desc{font-size:11.5px;color:var(--text-muted);margin-top:2px}
    .agent-tick{font-size:15px;color:var(--accent);opacity:0}
    .agent-item.selected .agent-tick{opacity:1}
    .agent-divider{height:1px;background:var(--border);margin:4px 8px}
    .agent-label{padding:8px 14px 4px;font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px}

    /* Plus menu popup */
    .plus-menu{position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:6px;min-width:175px;z-index:500;box-shadow:0 10px 36px rgba(0,0,0,.5);opacity:0;transform:scale(.93) translateY(6px);pointer-events:none;transition:opacity .14s,transform .14s;transform-origin:bottom left}
    .plus-menu.show{opacity:1;transform:scale(1) translateY(0);pointer-events:all}

    /* ── ARCHIVE PANEL ── */
    .archive-panel{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);max-width:90vw;background:var(--surface);border-right:1px solid var(--border);z-index:350;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .27s cubic-bezier(.4,0,.2,1)}
    .archive-panel.open{transform:translateX(0)}
    .archive-top{height:var(--header-h);min-height:var(--header-h);padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
    .archive-top span{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
    .archive-list{flex:1;overflow-y:auto;padding:8px 10px;list-style:none;-webkit-overflow-scrolling:touch}
    .archive-list::-webkit-scrollbar{display:none}
    .archive-item{display:flex;align-items:center;padding:10px 10px 10px 12px;border-radius:10px;gap:4px}
    .archive-item:active{background:var(--surface2)}
    .archive-info{flex:1;min-width:0;cursor:pointer}
    .archive-name{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .archive-date{font-size:11px;color:var(--text-dim);margin-top:2px}
    .unarchive-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:background .12s,color .12s}
    .unarchive-btn:active{background:var(--surface3);color:var(--accent)}

    /* ── MAIN ── */
    main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .chat-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px 14px 10px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
    .chat-area::-webkit-scrollbar{display:none}

    /* Incognito banner */
    .incognito-banner{display:none;align-items:center;gap:8px;padding:8px 16px;background:rgba(239,119,34,0.08);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-muted);flex-shrink:0}
    .incognito-banner.show{display:flex}
    .incognito-banner i{color:var(--accent);font-size:14px}

    /* ── WELCOME ── */
    .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-bottom:30px;text-align:center}
    .welcome.hidden{display:none}
    .welcome-icon-box{width:65px;height:65px;border-radius:18px;background:var(--accent);border:1px solid var(--accent-dim);box-shadow:0 10px 36px rgba(239,119,34,0.15) inset;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:6px}
    .welcome h2{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:var(--text)}
    .welcome p{font-size:14px;color:var(--text-muted);max-width:260px;line-height:1.65}

    /* ── MESSAGES ── */
    .messages{display:flex;flex-direction:column;gap:16px}
    .msg{display:flex;flex-direction:column;max-width:88%;animation:msgIn .2s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;align-items:flex-end}
    .msg.ai{align-self:flex-start;align-items:flex-start}

    /* AI header (agent + time) */
    .ai-msg-header{font-size:11px;color:var(--text-dim);margin-bottom:4px;padding-left:2px;display:flex;align-items:center;gap:4px}
    .ai-msg-header span{color:var(--accent);font-weight:600}

    .msg-bubble{padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.65;word-break:break-word;position:relative}
    .msg.user .msg-bubble{background:var(--user-bubble);color:var(--text);border:1px solid rgba(239,119,34,0.2);border-bottom-right-radius:4px;cursor:pointer}
    .msg.ai .msg-bubble{background:var(--ai-bubble);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
    .msg-bubble img{max-width:200px;border-radius:10px;margin-bottom:6px;display:block}

    /* File attachment chip */
    .file-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;max-width:220px}
    .file-chip i{font-size:18px;color:var(--accent);flex-shrink:0}
    .file-chip-info{min-width:0}
    .file-chip-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .file-chip-type{font-size:11px;color:var(--text-dim);margin-top:1px}

    /* User message meta (time + copy) — smooth slide-down reveal */
    .user-msg-meta{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:0 4px;
      overflow:hidden;
      max-height:0;
      opacity:0;
      margin-top:0;
      transform:translateY(-6px);
      transition:max-height .28s cubic-bezier(.4,0,.2,1),
                 opacity .22s ease,
                 margin-top .22s ease,
                 transform .25s cubic-bezier(.4,0,.2,1);
    }
    .msg.user.show-meta .user-msg-meta{
      max-height:36px;
      opacity:1;
      margin-top:6px;
      transform:translateY(0);
    }
    .user-msg-time{font-size:11px;color:var(--text-dim)}
    .copy-btn-small{display:flex;align-items:center;font-size:14px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .12s,color .12s}
    .copy-btn-small:active{background:var(--surface3);color:var(--text)}

    /* AI message footer (copy + time) */
    .ai-msg-footer{display:flex;align-items:center;gap:8px;margin-top:6px;padding:0 2px}
    .ai-copy-btn{display:flex;align-items:center;font-size:13px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:4px 6px;border-radius:7px;transition:background .12s,color .12s}
    .ai-copy-btn:active{background:var(--surface3);color:var(--text)}
    .ai-msg-time{font-size:11px;color:var(--text-dim)}

    /* Code block */
    .code-block{background:#0d0d0d;border:1px solid var(--border);border-radius:10px;margin:8px 0;overflow:hidden}
    .code-block-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);background:#111}
    .code-lang{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);font-family:'DM Sans',sans-serif}
    .code-lang i{font-size:13px;color:var(--accent)}
    .code-copy-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:3px 8px;border-radius:6px;font-family:'DM Sans',sans-serif;transition:background .12s,color .12s}
    .code-copy-btn:active{background:var(--surface3);color:var(--text)}
    .code-copy-btn i{font-size:13px}
    pre{margin:0;padding:12px;overflow-x:auto;font-size:13px;line-height:1.6}
    pre code{font-family:'Courier New',monospace;color:#e8e8e8;white-space:pre}

    /* ── TYPING ── */
    .typing-indicator{display:flex;align-items:center;gap:5px;padding:3px 0}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:tDot 1.2s ease-in-out infinite}
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes tDot{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}}

    /* ── INPUT AREA ── */
    .input-wrap{flex-shrink:0;padding:6px 10px 14px;background:var(--bg)}
    .attach-previews{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
    .preview-chip{position:relative;display:inline-flex}
    .preview-chip img{max-height:70px;border-radius:9px;border:1px solid var(--border)}
    .preview-chip .file-preview-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:7px 11px;font-size:12.5px;max-width:180px}
    .preview-chip .file-preview-chip i{font-size:16px;color:var(--accent);flex-shrink:0}
    .preview-chip .file-preview-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
    .preview-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--danger);border:none;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}

    /* 2-row input box matching sketch */
    .input-box{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:20px;
      padding:12px 12px 8px 14px;
      transition:border-color .2s;
      display:flex;
      flex-direction:column;
      gap:10px;
      width:100%;
    }
    .input-box:focus-within{border-color:rgba(239,119,34,.45)}

    /* Textarea row — full width, good min height */
    .input-textarea-row{display:flex;align-items:flex-start;width:100%}
    #msg-input{
      flex:1;width:100%;background:transparent;border:none;outline:none;
      color:var(--text);font-family:'DM Sans',sans-serif;
      font-size:15px;resize:none;
      max-height:140px;min-height:44px;
      line-height:1.6;
      padding:0;
    }
    #msg-input::placeholder{color:var(--text-dim)}

    /* Action row */
    .input-action-row{display:flex;align-items:center;justify-content:space-between;width:100%}
    .input-left-btns{display:flex;align-items:center;gap:6px}

    .plus-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background .15s,color .15s}
    .plus-btn:active{background:var(--surface3);color:var(--accent)}

    /* Agent pill toggle — neutral always */
    .agent-toggle-btn{height:30px;padding:0 10px 0 9px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;flex-shrink:0;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
    .agent-toggle-btn:active{background:var(--surface3)}
    .agent-toggle-btn .agent-pill-icon{font-size:12px; }
    .agent-toggle-btn .agent-pill-name{font-size:12px;max-width:55px;overflow:hidden;text-overflow:ellipsis}
    .agent-toggle-btn .agent-pill-arrow{font-size:10px;color:var(--text);opacity:.6;}

    .send-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;opacity:.3;pointer-events:none;transition:opacity .18s,transform .12s}
    .send-btn.enabled{opacity:1;pointer-events:all}
    .send-btn.enabled:active{transform:scale(.93)}
    .send-btn.locked{opacity:.3!important;pointer-events:none!important}

    /* hidden inputs */
    #camera-input,#image-input,#file-input{display:none}

    /* Incognito welcome override */
    .incognito-welcome .welcome-icon-box{background:var(--surface2);border-color:var(--border)}
  </style>
</head>
<body>
<div id="app">

  <div class="overlay" id="overlay" onclick="handleOverlayClick()"></div>

  <!-- ── SIDEBAR ── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">

<script>
// ════════════════════════════════════════════════
// MODELS  ← Edit these two strings to change models
// ════════════════════════════════════════════════
const AGENT1_MODEL = "qwen/qwen3-next-80b-a3b-instruct:free";
const AGENT2_MODEL = "qwen/qwen3-coder:free";
const AGENT1_LABEL = "Agent 1";
const AGENT2_LABEL = "Agent 2";

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
let chats         = JSON.parse(localStorage.getItem('zeni_chats')    || '[]');
let archived      = JSON.parse(localStorage.getItem('zeni_archived') || '[]');
let currentChatId = null;
let pendingChatId = null;
let ctxTargetId   = null;
let ctxSource     = 'chats';
let attachments   = [];   // [{type:'image'|'file', base64, mime, name}]
let aiThinking    = false;
let activeAgent   = 1;
let incognitoMode = false;
let incognitoMessages = [];  // temp storage, never saved

// ════════════════════════════════════════════════
// PERSIST
// ════════════════════════════════════════════════
const saveChats      = () => localStorage.setItem('zeni_chats',    JSON.stringify(chats));
const saveArchived   = () => localStorage.setItem('zeni_archived', JSON.stringify(archived));
const getCurrentChat = () => chats.find(c => c.id === currentChatId) || null;

// ════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); }
function formatDate(ts){
  const d=Date.now()-ts,MIN=60000,HR=3600000,DAY=86400000;
  if(d<MIN) return 'Just now';
  if(d<HR)  return `${Math.floor(d/MIN)} min ago`;
  if(d<4*HR) return `${Math.floor(d/HR)}h ago`;
  if(d<DAY) return 'Today';
  if(d<2*DAY) return 'Yesterday';
  return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

// ════════════════════════════════════════════════
// MARKDOWN + CODE RENDERING
// ════════════════════════════════════════════════
function renderContent(text){
  // detect code blocks ```lang\n...\n```
  let html = '';
  const parts = text.split(/(```[\s\S]*?```)/g);
  parts.forEach(part => {
    if(part.startsWith('```')){
      const lines = part.slice(3,-3).split('\n');
      const lang  = lines[0].trim() || 'code';
      const code  = lines.slice(1).join('\n');
      const icon  = langIcon(lang);
      html += `<div class="code-block">
        <div class="code-block-header">
          <span class="code-lang"><i class="${icon}"></i>${esc(lang)}</span>
          <button class="code-copy-btn" onclick="copyCode(this)"><i class="fi fi-rr-copy"></i></button>
        </div>
        <pre><code>${esc(code)}</code></pre>
      </div>`;
    } else {
      // basic markdown: **bold**, *italic*, newlines
      let t = esc(part)
        .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
        .replace(/\*(.+?)\*/g,'<em>$1</em>')
        .replace(/`([^`]+)`/g,'<code style="background:var(--surface3);padding:1px 5px;border-radius:4px;font-size:13px">$1</code>')
        .replace(/\n/g,'<br>');
      html += t;
    }
  });
  return html;
}

function langIcon(lang){
  const l = lang.toLowerCase();
  if(l==='python'||l==='py') return 'fi fi-rr-snake';
  if(l==='html') return 'fi fi-rr-browser';
  if(l==='css') return 'fi fi-rr-palette';
  if(l==='js'||l==='javascript'||l==='ts'||l==='typescript') return 'fi fi-rr-code-simple';
  if(l==='json') return 'fi fi-rr-curly-brackets';
  if(l==='bash'||l==='sh'||l==='shell') return 'fi fi-rr-terminal';
  return 'fi fi-rr-code-branch';
}

function copyCode(btn){
  const code = btn.closest('.code-block').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>';
    setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}

// ════════════════════════════════════════════════
// OVERLAY
// ════════════════════════════════════════════════
const showOverlay = () => document.getElementById('overlay').classList.add('show');
const hideOverlay = () => document.getElementById('overlay').classList.remove('show');
function handleOverlayClick(){
  if(document.getElementById('archivePanel').classList.contains('open')){
    closeArchivePanelOnly(); return;
  }
  closeSidebar(); closeAllMenus();
}

// ════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════
function toggleSidebar(){
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
}
function openSidebar(){
  renderChatsList();
  document.getElementById('chatSearch').value='';
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('chatsBtn').classList.add('active');
  showOverlay();
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('chatsBtn').classList.remove('active');
  if(!document.getElementById('archivePanel').classList.contains('open')) hideOverlay();
}

// Close only archive, keep sidebar open
function closeArchivePanelOnly(){
  document.getElementById('archivePanel').classList.remove('open');
  // Re-open sidebar
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('chatsBtn').classList.add('active');
  showOverlay();
}

// ════════════════════════════════════════════════
// RENDER CHATS LIST
// ════════════════════════════════════════════════
function renderChatsList(filter=''){
  const list = document.getElementById('chatsList');
  list.innerHTML='';
  const q = filter.toLowerCase();

  // Pinned first, then by updatedAt desc
  const sorted = [...chats].sort((a,b)=>{
    if(a.pinned && !b.pinned) return -1;
    if(!a.pinned && b.pinned) return 1;
    return b.updatedAt - a.updatedAt;
  });

  const filtered = q ? sorted.filter(c=>c.name.toLowerCase().includes(q)) : sorted;

  if(!filtered.length){
    list.innerHTML=`<li style="padding:20px 14px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.7;">${q?'No chats found.':'No chats yet.<br>Start a new one!'}</li>`;
    return;
  }
  filtered.forEach(c=>{
    const li=document.createElement('li');
    li.className='chat-item'+(c.id===currentChatId?' active':'')+(c.pinned?' pinned-item':'');
    li.innerHTML=`
      <div class="chat-info" onclick="openChat('${c.id}')">
        <div style="flex:1;min-width:0">
          <div class="chat-name">${esc(c.name)}</div>
          <div class="chat-date">${formatDate(c.updatedAt)}</div>
        </div>
        <i class="fi fi-br-thumbtack pin-icon"></i>
      </div>
      <button class="chat-menu-btn" onclick="openCtxMenu(event,'${c.id}','chats')">
        <i class="fi fi-rr-menu-dots-vertical"></i>
      </button>`;
    list.appendChild(li);
  });
}

function filterChats(val){ renderChatsList(val); }

// ════════════════════════════════════════════════
// NEW CHAT / OPEN CHAT
// ════════════════════════════════════════════════
function newChat(){
  if(incognitoMode){ clearIncognito(); return; }
  pendingChatId=genId(); currentChatId=null;
  document.getElementById('messages').innerHTML='';
  showWelcome(false);
  updateHeaderBtns(); renderChatsList(); closeSidebar(); closeAllMenus();
  setTimeout(()=>document.getElementById('msg-input').focus(),300);
}

function openChat(id){
  if(incognitoMode) return; // can't open saved chat in incognito
  pendingChatId=null; currentChatId=id;
  renderMessages(); renderChatsList(); updateHeaderBtns(); updateHeaderMenuContent(); closeSidebar();
}

// ════════════════════════════════════════════════
// WELCOME SCREEN
// ════════════════════════════════════════════════
function showWelcome(incognito){
  const ws=document.getElementById('welcomeScreen');
  const icon=document.getElementById('welcomeIcon');
  const title=document.getElementById('welcomeTitle');
  const sub=document.getElementById('welcomeSubtitle');
  ws.classList.remove('hidden','incognito-welcome');
  if(incognito){
    ws.classList.add('incognito-welcome');
    icon.className='fi fi-rr-incognito';
    icon.style.color='var(--text-muted)';
    title.textContent="Incognito Chat";
    sub.textContent="This chat won't be saved. Close incognito to end.";
  } else {
    icon.className='fi fi-rr-sparkles';
    icon.style.color='#fff';
    title.textContent="Hey, I'm Zeni";
    sub.textContent="Your AI assistant, ready to help with anything you need.";
  }
}

// ════════════════════════════════════════════════
// RENDER MESSAGES
// ════════════════════════════════════════════════
function renderMessages(){
  const chat=getCurrentChat();
  const msgEl=document.getElementById('messages');
  msgEl.innerHTML='';
  if(!chat||!chat.messages||!chat.messages.length){ showWelcome(false); return; }
  document.getElementById('welcomeScreen').classList.add('hidden');
  chat.messages.forEach(m=>buildMsgEl(m));
  scrollBottom();
}

function buildMsgEl(m, appendTo){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl = appendTo || document.getElementById('messages');
  const wrap  = document.createElement('div');
  wrap.className=`msg ${m.role}`;

  if(m.role==='user'){
    let bubbleContent='';
    // attachments in saved msg
    if(m.image) bubbleContent+=`<img src="${m.image}" alt="">`;
    if(m.fileChip) bubbleContent+=`<div class="file-chip"><i class="fi fi-rr-document"></i><div class="file-chip-info"><div class="file-chip-name">${esc(m.fileChip.name)}</div><div class="file-chip-type">${esc(m.fileChip.type)}</div></div></div>`;
    if(m.content) bubbleContent+=renderContent(m.content);

    wrap.innerHTML=`
      <div class="msg-bubble" onclick="toggleUserMeta(this.parentElement)">${bubbleContent}</div>
      <div class="user-msg-meta">
        <span class="user-msg-time">${fmtTime(m.ts||Date.now())}</span>
        <button class="copy-btn-small" onclick="copyMsg(event,this)"><i class="fi fi-rr-copy"></i></button>
      </div>`;
    wrap.dataset.text = m.content||'';
  } else {
    const agentLabel = m.agent||AGENT1_LABEL;
    const elapsed    = (m.elapsed !== undefined && m.elapsed !== null) ? ` • ${m.elapsed}s` : '';
    const timeStr    = fmtTime(m.ts||Date.now());
    wrap.innerHTML=`
      <div class="ai-msg-header"><span>${esc(agentLabel)}</span><span style="color:var(--text-dim)">${elapsed}</span></div>
      <div class="msg-bubble">${renderContent(m.content||'')}</div>
      <div class="ai-msg-footer">
        <button class="ai-copy-btn" onclick="copyAiMsg(event,this)"><i class="fi fi-rr-copy"></i></button>
        <span class="ai-msg-time">${timeStr}</span>
      </div>`;
    wrap.dataset.text = m.content||'';
  }
  msgEl.appendChild(wrap);
  return wrap;
}

function toggleUserMeta(wrap){ wrap.classList.toggle('show-meta'); }
function copyMsg(e,btn){
  e.stopPropagation();
  navigator.clipboard.writeText(btn.closest('.msg').dataset.text||'').then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>';
    setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}
function copyAiMsg(e,btn){
  e.stopPropagation();
  navigator.clipboard.writeText(btn.closest('.msg').dataset.text||'').then(()=>{
    btn.innerHTML='<i class="fi fi-rr-check"></i>';
    setTimeout(()=>{ btn.innerHTML='<i class="fi fi-rr-copy"></i>'; },1500);
  });
}

function scrollBottom(){
  const ca=document.getElementById('chatArea');
  requestAnimationFrame(()=>{ ca.scrollTop=ca.scrollHeight; });
}

// ════════════════════════════════════════════════
// SEND MESSAGE
// ════════════════════════════════════════════════
async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if((!text && !attachments.length) || aiThinking) return;

  const now=Date.now();
  const imgAtt  = attachments.find(a=>a.type==='image');
  const fileAtt = attachments.find(a=>a.type==='file');

  // ── Incognito mode ──
  if(incognitoMode){
    const uMsg={role:'user',content:text,image:imgAtt?`data:${imgAtt.mime};base64,${imgAtt.base64}`:null,fileChip:fileAtt?{name:fileAtt.name,type:fileAtt.mime}:null,fileData:fileAtt||null,ts:now};
    incognitoMessages.push(uMsg);
    input.value=''; input.style.height='auto'; clearAttachments(); toggleSend();
    buildMsgEl(uMsg);
    scrollBottom();
    await doAIReply(incognitoMessages, null, true);
    return;
  }

  // ── Normal mode ──
  if(!currentChatId){
    const id=pendingChatId||genId(); pendingChatId=null;
    chats.unshift({id,name:text.slice(0,42)||'New Chat',messages:[],createdAt:now,updatedAt:now});
    currentChatId=id; saveChats(); updateHeaderBtns(); updateHeaderMenuContent();
  }

  const chat=getCurrentChat();
  const uMsg={role:'user',content:text,image:imgAtt?`data:${imgAtt.mime};base64,${imgAtt.base64}`:null,fileChip:fileAtt?{name:fileAtt.name,type:fileAtt.mime}:null,fileData:fileAtt||null,ts:now};
  chat.messages.push(uMsg); chat.updatedAt=now; saveChats();

  input.value=''; input.style.height='auto'; clearAttachments(); toggleSend();
  buildMsgEl(uMsg); scrollBottom();
  renderChatsList(); // re-sort so active chat moves to top

  await doAIReply(chat.messages, chat, false);
}

async function doAIReply(messages, chat, isIncognito){
  aiThinking=true;
  lockSend(true);

  const startMs=Date.now();
  const agentLabel = activeAgent===1 ? AGENT1_LABEL : AGENT2_LABEL;
  const typing=showTyping();

  try {
    const replyText=await callAI(messages);
    const elapsed=Math.round((Date.now()-startMs)/1000);
    const aiMsg={role:'ai',content:replyText,agent:agentLabel,elapsed,ts:Date.now()};

    if(isIncognito){
      incognitoMessages.push(aiMsg);
    } else {
      chat.messages.push(aiMsg); chat.updatedAt=Date.now(); saveChats();
      renderChatsList();
    }
    typing.remove();
    buildMsgEl(aiMsg);
    scrollBottom();
  } catch(err){
    const errMsg={role:'ai',content:'⚠️ Something went wrong. Please check your API key and try again.',agent:agentLabel,ts:Date.now()};
    if(!isIncognito && chat){ chat.messages.push(errMsg); chat.updatedAt=Date.now(); saveChats(); }
    typing.remove(); buildMsgEl(errMsg); scrollBottom();
  }

  aiThinking=false; lockSend(false);
}

function showTyping(){
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='msg ai';
  const agentLabel=activeAgent===1?AGENT1_LABEL:AGENT2_LABEL;
  div.innerHTML=`<div class="ai-msg-header"><span>${esc(agentLabel)}</span></div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  msgEl.appendChild(div); scrollBottom(); return div;
}

async function callAI(messages){
  // Build formatted messages for API
  const formatted=messages.map(m=>{
    const parts=[];
    if(m.image){ const b64=m.image.split(',')[1]; const mime=m.image.split(';')[0].split(':')[1]; parts.push({type:'image_url',image_url:{url:`data:${mime};base64,${b64}`}}); }
    if(m.fileData && m.fileData.base64){
      // Send file as text extraction note + base64 (for PDF models that support it)
      parts.push({type:'text',text:`[File attached: ${m.fileData.name} (${m.fileData.mime})]\n${m.fileData.textContent||'[Binary file — please describe or answer based on the file name and context]'}`});
    }
    if(m.content) parts.push({type:'text',text:m.content});
    if(parts.length>1||m.image||m.fileData) return {role:m.role==='ai'?'assistant':'user',content:parts.length?parts:[{type:'text',text:m.content||''}]};
    return {role:m.role==='ai'?'assistant':'user',content:m.content||''};
  });

  const model = activeAgent===1 ? AGENT1_MODEL : AGENT2_MODEL;
  const systemPrompt = `You are Zeni, a highly capable AI assistant. Be helpful, clear, and concise. When writing code, always wrap it in proper markdown code blocks with the language specified (e.g. \`\`\`python). Format responses cleanly. If given a file or image, analyze it thoroughly and answer the user's question about it.`;

  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:formatted, model, systemPrompt})
  });
  if(!res.ok) throw new Error('API '+res.status);
  const data=await res.json();
  return data.reply;
}

// ════════════════════════════════════════════════
// SEND LOCK (while AI is thinking)
// ════════════════════════════════════════════════
function lockSend(lock){
  const btn=document.getElementById('sendBtn');
  lock ? btn.classList.add('locked') : btn.classList.remove('locked');
}

// ════════════════════════════════════════════════
// INPUT
// ════════════════════════════════════════════════
function onInput(){
  const ta=document.getElementById('msg-input');
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,120)+'px';
  toggleSend();
}
function onKeyDown(e){
  if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>600){ e.preventDefault(); sendMessage(); }
}
function toggleSend(){
  const btn=document.getElementById('sendBtn');
  const val=document.getElementById('msg-input').value.trim();
  (val||attachments.length)?btn.classList.add('enabled'):btn.classList.remove('enabled');
}

// ════════════════════════════════════════════════
// ATTACHMENTS (image / file)
// ════════════════════════════════════════════════
function triggerCamera(){ closePlusMenu(); document.getElementById('camera-input').click(); }
function triggerImage(){  closePlusMenu(); document.getElementById('image-input').click(); }
function triggerFile(){   closePlusMenu(); document.getElementById('file-input').click(); }

function handleFileAttach(e, type){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const result=ev.target.result;
    const base64=result.split(',')[1];
    const att={type, base64, mime:file.type, name:file.name, textContent:null};
    // For text-based files, extract text
    if(file.type==='text/plain'||file.type==='application/json'||file.name.endsWith('.md')||file.name.endsWith('.csv')){
      att.textContent=atob(base64);
    }
    attachments.push(att);
    renderAttachPreviews();
    toggleSend();
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function renderAttachPreviews(){
  const wrap=document.getElementById('attachPreviews');
  wrap.innerHTML='';
  attachments.forEach((a,i)=>{
    const chip=document.createElement('div');
    chip.className='preview-chip';
    if(a.type==='image'){
      chip.innerHTML=`<img src="data:${a.mime};base64,${a.base64}" alt=""><button class="preview-remove" onclick="removeAttachment(${i})"><i class="fi fi-rr-cross"></i></button>`;
    } else {
      chip.innerHTML=`<div class="file-preview-chip"><i class="fi fi-rr-document"></i><span class="file-preview-name">${esc(a.name)}</span></div><button class="preview-remove" onclick="removeAttachment(${i})"><i class="fi fi-rr-cross"></i></button>`;
    }
    wrap.appendChild(chip);
  });
}

function removeAttachment(i){ attachments.splice(i,1); renderAttachPreviews(); toggleSend(); }
function clearAttachments(){ attachments=[]; renderAttachPreviews(); }

// ════════════════════════════════════════════════
// PLUS MENU
// ════════════════════════════════════════════════

// AGENT MENU

// ════════════════════════════════════════════════
// INCOGNITO
// ════════════════════════════════════════════════
function toggleIncognito(){
  incognitoMode=!incognitoMode;
  const btn=document.getElementById('headerIncognitoBtn');
  const banner=document.getElementById('incognitoBanner');

  if(incognitoMode){
    btn.classList.add('incognito-on');
    banner.classList.add('show');
    // Hide group B
    document.getElementById('headerNewChatBtn').classList.remove('visible');
    document.getElementById('headerMenuBtn').classList.remove('visible');
    document.getElementById('headerCtxMenu').classList.remove('show');
    incognitoMessages=[];
    document.getElementById('messages').innerHTML='';
    showWelcome(true);
  } else {
    clearIncognito();
  }
}

function clearIncognito(){
  incognitoMode=false;
  incognitoMessages=[];
  document.getElementById('headerIncognitoBtn').classList.remove('incognito-on');
  document.getElementById('incognitoBanner').classList.remove('show');
  document.getElementById('messages').innerHTML='';
  if(currentChatId && getCurrentChat()) renderMessages();
  else showWelcome(false);
  updateHeaderBtns();
}

// Clear incognito on page refresh (already handled — incognitoMessages is in-memory only)
window.addEventListener('beforeunload',()=>{
  if(incognitoMode){ incognitoMode=false; incognitoMessages=[]; }
});

// ════════════════════════════════════════════════
// CONTEXT MENU
// ════════════════════════════════════════════════
function openCtxMenu(e,id,source){
  e.stopPropagation();
  ctxTargetId=id; ctxSource=source||'chats';
  const list=ctxSource==='archived'?archived:chats;
  const chat=list.find(c=>c.id===id); if(!chat) return;
  const menu=document.getElementById('ctxMenu');
  closeAllMenus(menu);
  let html=`<div class="ctx-label">${esc(chat.name)}</div>`;
  html+=`<button class="ctx-item" onclick="ctxAction('rename')"><i class="fi fi-rr-pencil"></i> Rename</button>`;
  if(ctxSource==='chats'){
    const pinLabel=chat.pinned?'Unpin':'Pin';
    const pinIcon =chat.pinned?'fi fi-rr-thumbtack-slash':'fi fi-rr-thumbtack';
    html+=`<button class="ctx-item" onclick="ctxAction('pin')"><i class="${pinIcon}"></i> ${pinLabel}</button>`;
    html+=`<button class="ctx-item" onclick="ctxAction('archive')"><i class="fi fi-rr-box"></i> Archive</button>`;
  } else {
    html+=`<button class="ctx-item" onclick="ctxAction('unarchive')"><i class="fi fi-rr-arrow-up-from-square"></i> Unarchive</button>`;
  }
  html+=`<button class="ctx-item danger" onclick="ctxAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>`;
  menu.innerHTML=html;
  const rect=e.currentTarget.getBoundingClientRect();
  const mW=175,mH=185;
  let top=rect.bottom+4, left=rect.left-mW+rect.width;
  if(top+mH>window.innerHeight) top=rect.top-mH-4;
  if(left<8) left=8;
  if(left+mW>window.innerWidth) left=window.innerWidth-mW-8;
  menu.style.top=top+'px'; menu.style.left=left+'px';
  menu.classList.add('show');
}

function ctxAction(action){
  const list=ctxSource==='archived'?archived:chats;
  const chat=list.find(c=>c.id===ctxTargetId);
  if(!chat){ closeAllMenus(); return; }

  if(action==='rename'){
    const name=prompt('Rename chat:',chat.name);
    if(name&&name.trim()){ chat.name=name.trim(); ctxSource==='archived'?saveArchived():saveChats(); renderChatsList(); renderArchiveList(); if(currentChatId===ctxTargetId) updateHeaderMenuContent(); }

  } else if(action==='pin'){
    chat.pinned=!chat.pinned; saveChats(); renderChatsList();

  } else if(action==='archive'){
    const idx=chats.findIndex(c=>c.id===ctxTargetId);
    if(idx!==-1){ const[r]=chats.splice(idx,1); r.archivedAt=Date.now(); archived.unshift(r); saveChats(); saveArchived();
      if(currentChatId===ctxTargetId){ currentChatId=null; document.getElementById('messages').innerHTML=''; showWelcome(false); updateHeaderBtns(); updateHeaderMenuContent(); }
      renderChatsList(); }

  } else if(action==='unarchive'){
    const idx=archived.findIndex(c=>c.id===ctxTargetId);
    if(idx!==-1){ const[r]=archived.splice(idx,1); delete r.archivedAt; r.updatedAt=Date.now(); chats.unshift(r); saveChats(); saveArchived(); renderArchiveList(); renderChatsList(); }

  } else if(action==='delete'){
    if(!confirm(`Delete "${chat.name}"?`)){ closeAllMenus(); return; }
    if(ctxSource==='archived'){ archived=archived.filter(c=>c.id!==ctxTargetId); saveArchived(); renderArchiveList(); }
    else { chats=chats.filter(c=>c.id!==ctxTargetId); saveChats();
      if(currentChatId===ctxTargetId){ currentChatId=null; document.getElementById('messages').innerHTML=''; showWelcome(false); updateHeaderBtns(); updateHeaderMenuContent(); }
      renderChatsList(); }
  }
  closeAllMenus();
}

// ════════════════════════════════════════════════
// HEADER BUTTONS
// ════════════════════════════════════════════════
function updateHeaderBtns(){
  if(incognitoMode) return;
  const active=!!(currentChatId&&getCurrentChat());
  // Group B (new chat + 3-dot): show when active
  document.getElementById('headerNewChatBtn').classList.toggle('visible',active);
  document.getElementById('headerMenuBtn').classList.toggle('visible',active);
  // Group A (incognito + image-gen): hide when active
  document.querySelectorAll('.header-grp-a').forEach(el=>el.classList.toggle('hidden-btn',active));
  if(!active) document.getElementById('headerCtxMenu').classList.remove('show');
}

function updateHeaderMenuContent(){
  const menu=document.getElementById('headerCtxMenu');
  const chat=getCurrentChat(); if(!chat){ menu.innerHTML=''; return; }
  menu.innerHTML=`
    <div class="ctx-label">${esc(chat.name)}</div>
    <button class="ctx-item" onclick="headerAction('rename')"><i class="fi fi-rr-pencil"></i> Rename</button>
    <button class="ctx-item" onclick="headerAction('archive')"><i class="fi fi-rr-box"></i> Archive</button>
    <a class="ctx-item" href="report.html" onclick="closeAllMenus()"><i class="fi fi-rr-flag"></i> Report</a>
    <button class="ctx-item danger" onclick="headerAction('delete')"><i class="fi fi-rr-trash"></i> Delete</button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" onclick="newChat()"><i class="fi fi-rr-comment-medical"></i> New Chat</button>`;
}

function toggleHeaderMenu(){
  const menu=document.getElementById('headerCtxMenu'); if(!getCurrentChat()) return;
  if(menu.classList.contains('show')) menu.classList.remove('show');
  else { updateHeaderMenuContent(); closeAllMenus(menu); menu.classList.add('show'); }
}

function headerAction(action){
  ctxTargetId=currentChatId; ctxSource='chats';
  document.getElementById('headerCtxMenu').classList.remove('show');
  ctxAction(action);
}

// ════════════════════════════════════════════════
// ARCHIVE PANEL
// ════════════════════════════════════════════════
function openArchivePanel(){
  renderArchiveList();
  document.getElementById('archivePanel').classList.add('open');
  showOverlay(); closeSidebar();
}

function renderArchiveList(){
  const list=document.getElementById('archiveList'); list.innerHTML='';
  if(!archived.length){ list.innerHTML=`<li style="padding:24px 14px;text-align:center;color:var(--text-dim);font-size:13px;">No archived chats.</li>`; return; }
  archived.forEach(c=>{
    const li=document.createElement('li'); li.className='archive-item';
    li.innerHTML=`
      <div class="archive-info" onclick="restoreAndOpen('${c.id}')">
        <div class="archive-name">${esc(c.name)}</div>
        <div class="archive-date">${formatDate(c.updatedAt)}</div>
      </div>
      <button class="unarchive-btn" onclick="quickUnarchive('${c.id}')"><i class="fi fi-rr-arrow-up-from-square"></i></button>
      <button class="chat-menu-btn" onclick="openCtxMenu(event,'${c.id}','archived')"><i class="fi fi-rr-menu-dots-vertical"></i></button>`;
    list.appendChild(li);
  });
}

function quickUnarchive(id){ ctxTargetId=id; ctxSource='archived'; ctxAction('unarchive'); }

function restoreAndOpen(id){
  // Open archived chat WITHOUT unarchiving — stays in archive
  const chat=archived.find(c=>c.id===id); if(!chat) return;
  // Temporarily view — render messages from archived chat
  document.getElementById('archivePanel').classList.remove('open');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('chatsBtn').classList.remove('active');
  hideOverlay();
  // Show messages inline (read-only view from archive)
  currentChatId=null; // not in main chats
  document.getElementById('welcomeScreen').classList.add('hidden');
  const msgEl=document.getElementById('messages');
  msgEl.innerHTML='';
  (chat.messages||[]).forEach(m=>buildMsgEl(m));
  scrollBottom();
  // Mark header with archived chat name but no save buttons
  document.getElementById('headerNewChatBtn').classList.remove('visible');
  document.getElementById('headerMenuBtn').classList.remove('visible');
}

// ════════════════════════════════════════════════
// CLOSE ALL MENUS
// ════════════════════════════════════════════════
function closeAllMenus(except){
  ['ctxMenu','headerCtxMenu','agentMenu','plusMenu'].forEach(id=>{
    const el=document.getElementById(id);
    if(el!==except) el.classList.remove('show');
  });
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.ctx-menu,.chat-menu-btn,.header-ctx-menu,#headerMenuBtn,.unarchive-btn,.agent-menu,#agentToggleBtn,.plus-menu,#plusBtn'))
    closeAllMenus();
});

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
showWelcome(false);
updateHeaderBtns();
updateHeaderMenuContent();
</script>
